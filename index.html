<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora</title>
<meta name="theme-color" content="#2C5F4A">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16221D; --paper:#F2F5F0; --surface:#FFFFFF; --muted:#6E7B74;
  --line:#DCE3DB; --pine:#2C5F4A; --oxblood:#8E2F26; --gold:#B0802A;
  --shadow:0 1px 2px rgba(22,34,29,.06), 0 6px 18px rgba(22,34,29,.05);
  --r:14px; --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow-anchor:none}
body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:calc(var(--nav-h) + 58px + env(safe-area-inset-bottom));}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Cabecera */
.top{position:sticky;top:0;z-index:30;background:var(--paper);
  padding:calc(14px + env(safe-area-inset-top)) 18px 0;border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
.brand .rosa{font-size:19px;vertical-align:2px;margin-right:2px;filter:saturate(.85)}
.tally{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.store-state{display:flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;
  font-size:10px;letter-spacing:.05em;color:var(--muted);margin-top:8px}
.store-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.store-dot.ok{background:var(--pine)}

/* Filtros */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 13px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:500;color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.7;margin-left:5px}
.chip-sep{flex:none;width:1px;background:var(--line);margin:3px 3px}
.rotulo{display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 12px 2px}
.rotulo::after{content:"";flex:1;height:1px;background:var(--line)}
.cal-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin:0 -12px 10px}
.cal-tab{padding:9px 0 8px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.cal-tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

/* Cabecera de días */
.tg-head{display:flex;margin-bottom:2px}
.tg-head .hueco{width:46px;flex:none}
.tg-head .cols{flex:1;display:grid}
.tg-dh{text-align:center;padding:2px 0 8px}
.tg-dh .dow{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
.tg-dh .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:24px;line-height:1.1;letter-spacing:-.03em}
.tg-dh.hoy .num{background:var(--pine);color:#fff;border-radius:9px;
  padding:3px 0 4px;margin:0 6px;font-size:21px}
.tg-dh.hoy .dow{color:var(--pine)}

/* Franja de todo el día */
.allday{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:26px}
.allday .hueco{width:46px;flex:none;font-family:"JetBrains Mono",monospace;font-size:8.5px;
  color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;letter-spacing:.06em}
.allday .cols{flex:1;display:grid;gap:2px;padding:3px 0}
.allday .col{display:flex;flex-direction:column;gap:2px;min-width:0}
.ad-ev{font-size:10.5px;padding:2px 6px;border-radius:5px;color:#fff;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;text-align:left;width:100%}

/* Rejilla horaria */
.tg-wrap{position:relative;max-height:340px;overflow-y:auto;overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch}
.tg{display:flex;position:relative}
.tg-hours{width:46px;flex:none;position:relative}
.tg-hours div{height:52px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);
  text-align:right;padding-right:6px;transform:translateY(-6px)}
.tg-cols{flex:1;display:grid;border-left:1px solid var(--line)}
.tg-col{position:relative;border-right:1px solid var(--line);
  background:repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 52px)}
.tg-col.hoy{background-color:rgba(44,95,74,.045)}
.tg-ev{position:absolute;left:2px;right:3px;border-radius:7px;padding:3px 6px;color:#fff;
  overflow:hidden;text-align:left;min-height:22px;box-shadow:0 1px 3px rgba(22,34,29,.18)}
.tg-ev b{display:block;font-size:11px;font-weight:600;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-ev i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:9px;opacity:.85}
.ahora{position:absolute;left:0;right:0;height:1px;background:var(--oxblood);z-index:3}
.ahora::before{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;
  border-radius:50%;background:var(--oxblood)}

/* Día seleccionado bajo el mes */
.dia-sel{margin-top:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 6px}
.dia-sel .cab{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;
  letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:2px}
.dia-vacio{font-size:13.5px;color:var(--muted);font-style:italic;margin-bottom:9px}
.add-dia{width:100%;padding:11px;border:1px dashed var(--line);border-radius:10px;
  color:var(--pine);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:7px}
.mini-ev{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:left;
  border-bottom:1px solid var(--line)}
.mini-ev:last-of-type{border-bottom:none}
.mini-ev .marca{flex:none;width:4px;height:30px;border-radius:99px}
.mini-ev .h{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);flex:none}
.mini-ev .t{flex:1;min-width:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Leyenda */
.leyenda{display:flex;flex-wrap:wrap;gap:11px;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:10px}
.leyenda span{display:flex;align-items:center;gap:5px;font-family:"JetBrains Mono",monospace;
  font-size:9.5px;color:var(--muted);letter-spacing:.04em}
.leyenda i{width:7px;height:7px;border-radius:50%}

.cal-d.inrango{background:rgba(44,95,74,.07)}
.cal-d.inrango.hoy{background:rgba(44,95,74,.16)}

/* Grupos por fecha */
main{padding:6px 18px 30px}
.view{display:none}
.view.on{display:block}
.group{margin-bottom:26px}
.group-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.gday{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:34px;
  line-height:.82;letter-spacing:-.035em}
.group.today .gday{background:var(--pine);color:#fff;border-radius:11px;
  padding:7px 9px 8px;line-height:1;letter-spacing:-.03em;font-size:30px}
.group.today .glabel{color:var(--pine);font-weight:600;padding-bottom:6px}
.glabel{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);padding-bottom:3px}
.group.late .gday,.group.late .glabel{color:var(--oxblood)}

.spine{border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:8px}
.group.late .spine{border-left-color:rgba(142,47,38,.35)}
.group.today .spine{border-left-color:rgba(44,95,74,.4)}

/* Tarea */
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.task-main{display:flex;align-items:flex-start;gap:11px;padding:12px 13px}
.box{flex:none;width:21px;height:21px;margin-top:1px;border-radius:7px;border:1.6px solid var(--line);
  background:var(--surface);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s}
.task.done .box{background:var(--pine);border-color:var(--pine)}
.task.done .box svg{opacity:1;transform:scale(1)}
.body{flex:1;min-width:0;text-align:left}
.title{font-weight:500;word-break:break-word;transition:color .15s}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:4px}
.meta span{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.04em;color:var(--muted)}
.pri{display:inline-flex;align-items:center;gap:4px}
.pri::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted)}
.pri.alta{color:var(--oxblood)}.pri.alta::before{background:var(--oxblood)}
.pri.media{color:var(--gold)}.pri.media::before{background:var(--gold)}
.dot-sep{color:var(--line)}
.prog{flex:none;align-self:center;font-family:"JetBrains Mono",monospace;font-size:11px;
  color:var(--muted);display:flex;align-items:center;gap:5px;padding-left:2px}
.chev{width:11px;height:11px;stroke:var(--muted);stroke-width:2;fill:none;transition:transform .18s}
.task.open .chev{transform:rotate(180deg)}

/* Subtareas */
.subs{display:none;border-top:1px solid var(--line);background:#FBFCFA;padding:4px 13px 8px 20px}
.task.open .subs{display:block}
.sub{display:flex;align-items:flex-start;gap:10px;padding:8px 0 8px 16px;position:relative}
.sub::before{content:"";position:absolute;left:0;top:0;bottom:50%;width:11px;
  border-left:1px solid var(--line);border-bottom:1px solid var(--line);border-bottom-left-radius:6px}
.sub .box{width:18px;height:18px;border-radius:6px}
.sub .box svg{width:10px;height:10px}
.sub .title{font-size:14px}
.sub.done .box{background:var(--pine);border-color:var(--pine)}
.sub.done .box svg{opacity:1;transform:scale(1)}
.sub.done .title{text-decoration:line-through;color:var(--muted)}
.add-sub{margin-left:16px;margin-top:2px;font-size:13px;color:var(--muted);
  display:flex;align-items:center;gap:6px;padding:6px 0;font-weight:500}
.add-sub b{font-size:15px;line-height:1;font-weight:600}

/* Evento */
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);display:flex;align-items:stretch;overflow:hidden;text-align:left;width:100%}
.ev-bar{flex:none;width:3px;background:var(--muted)}
.ev-bar.viaje{background:#2F6F8F}.ev-bar.salud{background:var(--oxblood)}
.ev-bar.marines{background:var(--pine)}.ev-bar.coche{background:var(--gold)}
.ev-bar.familia{background:#8A5FA8}.ev-bar.ocio{background:#C2743F}
.ev-in{flex:1;min-width:0;padding:12px 13px}
.ev-hora{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.05em}
.ev-tit{font-weight:500;margin-top:2px;word-break:break-word}
.ev-cancel .ev-tit{text-decoration:line-through;color:var(--muted)}
.ev-coste{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.ev-foot{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:5px}
.ev-foot span{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.tag-gar{color:var(--pine)!important;border:1px solid rgba(44,95,74,.3);border-radius:99px;padding:1px 7px}
.tag-gar.venc{color:var(--muted)!important;border-color:var(--line)}
.tramo{color:var(--pine)!important;background:rgba(44,95,74,.09);border-radius:99px;padding:1px 7px}

/* Mini calendario */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:12px 12px 8px;margin-bottom:22px}

/* Modo mes a pantalla completa: la rejilla se estira hasta llenar la pantalla.
   --alto-fuera = lo que ocupan cabecera, pestañas, barra de añadir y navegación. */
body.mes-full{--alto-fuera:288px}
body.mes-full .store-state{display:none}
body.mes-full .cal{background:none;border:none;box-shadow:none;padding:0;margin-bottom:10px}
body.mes-full .cal-grid{height:calc(100dvh - var(--alto-fuera));
  grid-template-rows:auto;grid-auto-rows:1fr}
body.mes-full .cal-d{aspect-ratio:auto;height:100%;min-height:0;font-size:16px;gap:5px}
body.mes-full .cal-d .ev-barras{height:auto;gap:2px;padding:0 6px}
body.mes-full .cal-d .ev-barras b{height:4px;min-height:4px;border-radius:3px}
body.mes-full .cal-dow{font-size:11px;padding-bottom:7px}

/* Vista Año: los 12 meses de un vistazo */
.anio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media (min-width:640px){.anio-grid{grid-template-columns:repeat(3,1fr)}}
.mini-mes{border:1px solid var(--line);border-radius:10px;padding:8px}
.mini-mes-tit{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:12.5px;
  text-align:center;margin-bottom:6px}
.mini-mes-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-mes-grid span,.mini-mes-grid button{aspect-ratio:1;display:flex;align-items:center;
  justify-content:center;font-size:9.5px;border-radius:4px;position:relative;color:var(--ink)}
.mini-mes-grid span.out{visibility:hidden}
.mini-mes-grid button.hoy{background:var(--pine);color:#fff;font-weight:700}
.mini-mes-grid button.con-ev::after{content:'';position:absolute;bottom:1px;width:3px;height:3px;
  border-radius:50%;background:var(--pine)}
.mini-mes-grid button.con-ev.hoy::after{background:#fff}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-mes{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em}
.cal-nav{display:flex;gap:2px}
.cal-nav button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.cal-nav svg{width:14px;height:14px;stroke:var(--muted);stroke-width:2;fill:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--muted);
  text-align:center;padding-bottom:5px;letter-spacing:.06em}
.cal-d{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:13px;position:relative;
  overflow:hidden;min-height:0}
.cal-d.out{color:var(--line)}
.cal-d.hoy{background:var(--pine);color:#fff;font-weight:700}
.cal-d.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-d.hoy.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-d .ev-barras{display:flex;flex-direction:column;gap:1px;width:100%;height:13px;
  padding:0 4px;box-sizing:border-box;overflow:hidden;flex:none;margin:0}
.cal-d .ev-barras b{display:block;height:3px;min-height:3px;flex:none;border-radius:2px;position:relative}
.cal-d .ev-barras b em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:6px;font-weight:700;color:rgba(255,255,255,.95);line-height:1}
.cal-d.out .ev-barras{opacity:0}

/* Hechas */
.done-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 2px;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}

/* Vacío */
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty h2{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;
  color:var(--ink);margin-bottom:6px;letter-spacing:-.01em}
.empty p{font-size:14px}

/* Añadir */
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:25;
  padding:9px 18px;background:linear-gradient(to top,var(--paper) 68%,rgba(242,245,240,0))}
.composer-in{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 7px 7px 16px;box-shadow:var(--shadow)}
.composer-in input{flex:1;border:none;background:none;outline:none;font-size:15px;min-width:0}
.composer-in input::placeholder{color:var(--muted)}
.send{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);
  display:grid;place-items:center;transition:opacity .15s,transform .1s}
.send:active{transform:scale(.93)}
.send:disabled{opacity:.28}
.send svg{width:15px;height:15px;stroke:#fff;stroke-width:2.4;fill:none}

/* Navegación */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;
  justify-content:center;font-size:9.5px;font-weight:500;color:var(--muted)}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none}
.nav-btn[aria-current="page"]{color:var(--ink);font-weight:600}
.nav-btn.soon{opacity:.42}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 62px);z-index:26;
  width:50px;height:50px;border-radius:50%;background:var(--pine);display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(44,95,74,.34);transition:transform .1s}
.fab:active{transform:scale(.94)}
.fab svg{width:21px;height:21px;stroke:#fff;stroke-width:1.9;fill:none}

/* Panel */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(22,34,29,.42);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:0;z-index:51;background:var(--surface);
  border-radius:0;padding:calc(8px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 16px}
.sheet h2{font-family:"Bricolage Grotesque",sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
/* Panel en filas: etiqueta a la izquierda, valor a la derecha */
.rot-sheet{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.tit-grande{width:100%;font-size:15px;font-weight:500;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:16px;
  line-height:1.4;resize:none;overflow:hidden;font-family:inherit}
.filas{border-top:1px solid var(--line)}
.fila{display:flex;align-items:center;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line);
  width:100%;text-align:left;background:none;min-height:46px}
.fila .et{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:9px;flex:none}
.fila .et svg{width:17px;height:17px;stroke:var(--muted);stroke-width:1.7;fill:none;flex:none}
.fila input,.fila select,.fila textarea{flex:1;min-width:0;text-align:right;background:none;
  border:none;padding:6px 0;font-size:14px;color:var(--ink);font-family:inherit;border-radius:0}
.fila textarea{resize:none;overflow:hidden;line-height:1.4}
.fila select{direction:rtl}
.fila select option{direction:ltr}
.fila input::placeholder,.fila textarea::placeholder{color:var(--pine);opacity:1}
.fila .punto-cat{width:9px;height:9px;border-radius:50%;flex:none;margin-left:auto}
.fila .punto-cat + input{flex:none;width:auto;max-width:60%}
.fila .sw{width:40px;height:23px;border-radius:99px;background:var(--line);padding:2px;flex:none;
  margin-left:auto;display:flex;align-items:center;transition:background .16s}
.fila .sw i{width:19px;height:19px;border-radius:50%;background:#fff;display:block;transition:transform .16s}
.fila[aria-pressed="true"] .sw{background:var(--pine)}
.fila[aria-pressed="true"] .sw i{transform:translateX(17px)}
.field{margin-bottom:15px}
.field label{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper);outline:none;font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pine)}
.campo-x{position:relative;display:block}
.campo-x input{padding-right:38px}
.campo-x button{position:absolute;right:9px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;background:rgba(22,34,29,.1);
  font-size:11px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.field textarea{resize:vertical;min-height:64px}
.duo{display:flex;gap:10px}
.duo .field{flex:1}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.check{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper);margin-bottom:15px;width:100%;text-align:left}
.check i{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--line);
  background:var(--surface);flex:none;display:grid;place-items:center}
.check[aria-pressed="true"] i{background:var(--pine);border-color:var(--pine)}
.check i::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translateY(-1px);opacity:0}
.check[aria-pressed="true"] i::after{opacity:1}
.check span{font-size:14px}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.btn-save{flex:1;padding:13px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600}
.btn-del{padding:13px 16px;border-radius:12px;border:1px solid var(--line);color:var(--oxblood);font-weight:600}


/* ---------- Notas ---------- */
.notas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start}
@media (min-width:640px){.notas{grid-template-columns:repeat(3,1fr)}}
.nota{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:11px 12px 10px;position:relative;text-align:left;width:100%;
  transition:transform .12s,box-shadow .12s,opacity .12s}
.nota .n-tit{font-weight:600;font-size:14px;line-height:1.3;margin-bottom:4px;
  word-break:break-word;padding-right:16px}
.nota .n-txt{font-size:13px;line-height:1.45;color:#3D4B44;white-space:pre-wrap;
  word-break:break-word;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.nota .n-pie{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.nota .n-eti{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);border:1px solid rgba(22,34,29,.14);
  border-radius:99px;padding:1px 7px}
.nota .n-fec{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--muted)}
.n-pin{position:absolute;top:8px;right:8px;width:22px;height:22px;display:grid;place-items:center;
  border-radius:6px;opacity:.32}
.n-pin svg{width:13px;height:13px;stroke:var(--ink);stroke-width:1.8;fill:none}
.nota.fija .n-pin{opacity:1}
.nota.fija .n-pin svg{fill:var(--ink)}
.n-asa{position:absolute;bottom:4px;right:4px;width:28px;height:28px;display:grid;place-items:center;
  opacity:.3;touch-action:none;cursor:grab}
.n-asa svg{width:13px;height:13px;stroke:var(--ink);stroke-width:1.9;fill:none}
.nota.llevando{opacity:.55;transform:scale(.96);box-shadow:0 10px 24px rgba(22,34,29,.2);z-index:5}
.nota.destino{outline:2px dashed var(--pine);outline-offset:2px}
.n-seccion{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:2px 0 9px 2px}
.colores{display:flex;gap:8px;flex-wrap:wrap}
.colores button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(22,34,29,.14)}
.colores button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}


/* ---------- Editor de notas a pantalla completa ---------- */
.editor{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:var(--surface)}
.editor.on{display:flex}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;flex:none}
.ed-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.ed-ico svg{width:19px;height:19px;stroke:var(--ink);stroke-width:1.8;fill:none}
.ed-ico[aria-pressed="true"] svg{fill:var(--ink)}
.ed-ico[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)!important}
.ed-ico[aria-pressed="true"] svg{stroke:#fff;fill:#fff}
.ed-ico[aria-pressed="false"]{opacity:.45}
.ed-ico.borrar svg{stroke:var(--oxblood)}
.ed-tit{border:none;background:none;outline:none;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:22px;letter-spacing:-.02em;padding:4px 18px 8px;flex:none}
.ed-tit::placeholder{color:var(--muted);opacity:.5}
.ed-tools{display:flex;gap:2px;padding:0 12px 6px;flex:none;overflow-x:auto;scrollbar-width:none}
.ed-tools::-webkit-scrollbar{display:none}
.ed-tools button{flex:none;min-width:36px;height:34px;border-radius:8px;padding:0 8px;
  font-size:14px;color:var(--muted);display:grid;place-items:center}
.ed-tools button:active{background:var(--paper)}
.ed-tools .b{font-weight:800;color:var(--ink)}
.ed-tools .i{font-style:italic}
.ed-tools .u{text-decoration:underline}
.ed-tools .s{text-decoration:line-through}
.ed-tools svg{width:17px;height:17px;stroke:var(--ink);stroke-width:1.8;fill:none}
.ed-sep{width:1px;background:var(--line);margin:6px 5px;flex:none}
.ed-body{flex:1;overflow-y:auto;padding:4px 18px 24px;outline:none;font-size:16px;line-height:1.55}
.ed-body:empty::before{content:attr(data-ph);color:var(--muted);opacity:.55}
.ed-body ul,.ed-body ol{padding-left:22px;margin:6px 0}
.ed-body li{margin:2px 0}
.ed-foot{flex:none;border-top:1px solid rgba(22,34,29,.1);padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none}
.ed-foot::-webkit-scrollbar{display:none}
.ed-proy{position:relative;flex:none;display:inline-flex;align-items:center}
.ed-proy input{width:132px;border:1px solid rgba(22,34,29,.15);background:transparent;
  border-radius:8px;padding:7px 26px 7px 9px;font-size:13px;outline:none}
.ed-proy button{position:absolute;right:5px;width:18px;height:18px;border-radius:50%;
  background:rgba(22,34,29,.12);font-size:10px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.ed-foot select{flex:none;border:1px solid rgba(22,34,29,.15);background:transparent;
  border-radius:8px;padding:7px 9px;font-size:13px;outline:none}
.ed-cols{display:flex;gap:7px;flex:none}
.ed-cols button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(22,34,29,.18)}
.ed-cols button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- Listas (compra, materiales…) ---------- */
.ed-items{flex:1;overflow-y:auto;padding:2px 12px 24px}
.it-fila{display:flex;align-items:center;gap:9px;padding:3px 0}
.it-fila .caja{flex:none;width:20px;height:20px;border-radius:6px;border:1.6px solid rgba(22,34,29,.25);
  background:transparent;display:grid;place-items:center}
.it-fila .caja svg{width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0}
.it-fila.ok .caja{background:var(--pine);border-color:var(--pine)}
.it-fila.ok .caja svg{opacity:1}
.it-fila input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:15.5px;padding:7px 0}
.it-fila.ok input{text-decoration:line-through;color:var(--muted)}
.it-quitar{flex:none;width:28px;height:28px;display:grid;place-items:center;opacity:.35}
.it-quitar svg{width:13px;height:13px;stroke:var(--ink);stroke-width:2;fill:none}
.it-add{display:flex;align-items:center;gap:9px;padding:9px 0;color:var(--muted);font-size:15px;width:100%}
.it-add b{font-size:19px;font-weight:600;width:20px;text-align:center}
.it-limpiar{margin-top:14px;padding:9px 14px;border:1px solid rgba(22,34,29,.15);
  border-radius:10px;font-size:13px;color:var(--muted);font-weight:500}

/* Lista dentro de la tarjeta */
.n-lista{margin-top:2px}
.n-li{display:flex;align-items:flex-start;gap:7px;padding:3px 0;width:100%;text-align:left}
.n-li i{flex:none;width:14px;height:14px;border-radius:4px;border:1.4px solid rgba(22,34,29,.3);
  margin-top:2px;display:grid;place-items:center}
.n-li i::after{content:"";width:6px;height:3px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;
  transform:rotate(-45deg) translateY(-1px);opacity:0}
.n-li.ok i{background:var(--pine);border-color:var(--pine)}
.n-li.ok i::after{opacity:1}
.n-li span{font-size:12.5px;line-height:1.35;word-break:break-word}
.n-li.ok span{text-decoration:line-through;color:var(--muted)}
.n-mas{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--muted);margin-top:4px;display:block}

.recien{animation:aparece 2.4s ease-out}
@keyframes aparece{
  0%{box-shadow:0 0 0 3px rgba(44,95,74,.55)}
  70%{box-shadow:0 0 0 3px rgba(44,95,74,.35)}
  100%{box-shadow:var(--shadow)}
}


/* ---------- Inicio ---------- */
.hoy-cab{margin:2px 0 20px}
.fij-tile{touch-action:pan-y}
.fij-tile.arrastrando{opacity:.85;box-shadow:0 10px 22px rgba(0,0,0,.2);z-index:5;transition:none;cursor:grabbing}
.acceso-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:22px 8px;font-size:26px;text-align:center}
.acceso-tile .acc-et{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.04em;
  color:var(--muted);text-transform:uppercase}
.ayuda-cat{font-size:13px;color:var(--muted);margin:2px 0 14px}
.fila-cat{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fila-cat .cat-color{flex:none;width:32px;height:32px;border:none;border-radius:8px;padding:0;background:none}
.fila-cat .cat-icono{flex:none;width:36px;height:36px;text-align:center;font-size:18px;
  border:1px solid var(--line);border-radius:8px;padding:0}
.fila-cat .cat-nombre{flex:1;min-width:0;font-size:14.5px}
.hoy-fecha{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;
  letter-spacing:-.03em;line-height:1.05}
.hoy-sub{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-top:5px}
.bloque{margin-bottom:24px}
.bloque-cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bloque-cab h3{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);font-weight:400}
.bloque-cab::after{content:"";flex:1;height:1px;background:var(--line)}
.bloque-cab .ir{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--pine);
  letter-spacing:.08em;text-transform:uppercase;flex:none}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);display:flex;align-items:stretch;overflow:hidden;width:100%;
  text-align:left;margin-bottom:8px}
.res-bar{flex:none;width:3px}
.res-in{flex:1;min-width:0;padding:11px 13px;display:flex;align-items:center;gap:11px}
.res-h{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);flex:none;
  min-width:46px;white-space:nowrap}
.res-h.dia{font-size:9.5px;letter-spacing:.04em}
.res-t{flex:1;min-width:0;font-size:14.5px;font-weight:500;word-break:break-word}
.res-x{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);flex:none}
.res.urgente .res-x{color:var(--oxblood)}
.res-t{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.res-sub{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);
  letter-spacing:.03em;font-weight:400}
.res-x.rojo{color:var(--oxblood);font-weight:600}
.mini-check{flex:none;width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line);
  display:inline-block;vertical-align:-1px;margin-right:2px}
.bloque-cab.alerta h3{color:var(--oxblood);font-weight:600}
.bloque-cab.alerta::after{background:rgba(142,47,38,.25)}
.dia-cab{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:12px 0 6px 2px}
.dia-cab:first-child{margin-top:2px}
.ver-mas{width:100%;padding:10px;font-size:13px;color:var(--muted);font-weight:500;
  border:1px dashed var(--line);border-radius:11px;margin-top:4px}
.respira{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:20px 16px;text-align:center}
.respira b{display:block;font-size:14.5px;font-weight:600;margin-bottom:3px}
.respira span{font-size:12.5px;color:var(--muted)}
.marcador{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.mrk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:11px 10px;text-align:center}
.mrk b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:24px;letter-spacing:-.03em;line-height:1.1}
.mrk span{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)}
.mrk.alerta b{color:var(--oxblood)}
.compra-res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:12px 13px;width:100%;text-align:left}
.compra-res .ct{font-weight:600;font-size:14px;margin-bottom:7px;display:flex;
  justify-content:space-between;gap:10px;align-items:center}
.compra-res .ct em{font-style:normal;font-family:"JetBrains Mono",monospace;
  font-size:10.5px;color:var(--muted);font-weight:400}
.compra-res .ci{display:flex;flex-wrap:wrap;gap:5px}
.compra-res .ci span{font-size:12.5px;background:var(--paper);border:1px solid var(--line);
  border-radius:99px;padding:2px 9px}

.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:9px}
.op i{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center}
.op i svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.8;fill:none}
.op b{display:block;font-size:14.5px;font-weight:600}
.op span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.op.peligro i svg{stroke:var(--oxblood)}


/* ---------- Datos (fichas de referencia) ---------- */
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
.ficha-cab{display:flex;align-items:center;gap:11px;padding:12px 13px;width:100%;text-align:left}
.ficha-ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:16px;background:var(--paper);border:1px solid var(--line)}
.ficha-t{flex:1;min-width:0}
.ficha-t b{display:block;font-size:14.5px;font-weight:600;word-break:break-word}
.ficha-t span{display:block;font-family:"JetBrains Mono",monospace;font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.ficha-chev{flex:none;width:12px;height:12px;stroke:var(--muted);stroke-width:2;fill:none;transition:transform .18s}
.ficha.open .ficha-chev{transform:rotate(180deg)}
.ficha-campos{display:none;border-top:1px solid var(--line);background:#FBFCFA;padding:3px 13px 9px}
.ficha.open .ficha-campos{display:block}
.campo{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.campo:last-of-type{border-bottom:none}
.campo .k{flex:none;width:33%;font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--muted);word-break:break-word}
.campo .v{flex:1;min-width:0;text-align:left;font-size:14.5px;word-break:break-word;
  display:flex;align-items:center;gap:7px}
.campo .v svg{width:12px;height:12px;stroke:var(--muted);stroke-width:1.8;fill:none;flex:none;opacity:.5}
.campo .v:active{color:var(--pine)}
.ficha-nota{font-size:13px;color:var(--muted);padding:9px 0 2px;white-space:pre-wrap}
.fila-campo{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.fila-campo input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper);outline:none;font-size:14.5px}
.fila-campo input:first-child{flex:0 0 36%}
.fila-campo input:focus{border-color:var(--pine)}
.fila-campo button{flex:none;width:30px;height:30px;display:grid;place-items:center;opacity:.4}
.fila-campo button svg{width:13px;height:13px;stroke:var(--ink);stroke-width:2;fill:none}
.add-campo{display:flex;align-items:center;gap:8px;padding:9px 0;color:var(--pine);
  font-size:14px;font-weight:600;width:100%}
.add-campo b{font-size:18px;line-height:1}


/* ---------- Buscar ---------- */
.buscador{position:fixed;inset:0;z-index:65;display:none;flex-direction:column;background:var(--paper)}
.buscador.on{display:flex}
.bs-top{display:flex;align-items:center;gap:9px;flex:none;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--surface);
  border-bottom:1px solid var(--line)}
.bs-atras{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.bs-atras svg{width:19px;height:19px;stroke:var(--ink);stroke-width:1.9;fill:none}
.bs-campo{flex:1;min-width:0;border:none;background:none;outline:none;font-size:16.5px;padding:6px 0}
.bs-limpiar{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--paper);opacity:.6}
.bs-limpiar svg{width:12px;height:12px;stroke:var(--ink);stroke-width:2.2;fill:none}
.bs-atajos{display:flex;gap:7px;overflow-x:auto;padding:11px 14px 3px;scrollbar-width:none;flex:none}
.bs-atajos::-webkit-scrollbar{display:none}
.bs-res{flex:1;overflow-y:auto;padding:8px 14px calc(24px + env(safe-area-inset-bottom))}
.bs-grupo{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:16px 0 8px 2px;display:flex;align-items:center;gap:9px}
.bs-grupo::after{content:"";flex:1;height:1px;background:var(--line)}
.bs-item{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.bs-ico{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:14px;background:var(--paper);border:1px solid var(--line)}
.bs-txt{flex:1;min-width:0}
.bs-txt b{display:block;font-weight:500;font-size:14.5px;word-break:break-word}
.bs-txt span{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;
  color:var(--muted);margin-top:3px;letter-spacing:.04em}
.bs-txt mark{background:rgba(176,128,42,.28);color:inherit;border-radius:3px;padding:0 1px}
.bs-lado{flex:none;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);text-align:right}
.bs-lado b{display:block;color:var(--ink);font-size:12px}
.bs-total{background:var(--ink);color:#fff;border-radius:12px;padding:13px 15px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bs-total span{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.75}
.bs-total b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;letter-spacing:-.02em}
.bs-vacio{text-align:center;padding:52px 22px;color:var(--muted)}
.bs-vacio h3{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:700;
  color:var(--ink);margin-bottom:6px}
.bs-vacio p{font-size:13.5px}
.lupa{position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 62px);
  z-index:26;width:50px;height:50px;border-radius:50%;background:var(--pine);
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(44,95,74,.34);transition:transform .1s}
.lupa:active{transform:scale(.94)}
.lupa svg{width:21px;height:21px;stroke:#fff;stroke-width:2;fill:none}


/* ---------- Proyectos ---------- */
.pr-chip{display:inline-flex;align-items:center;gap:5px;font-family:"JetBrains Mono",monospace;
  font-size:10px;letter-spacing:.05em;color:var(--pine);background:rgba(44,95,74,.09);
  border-radius:99px;padding:2px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-chip::before{content:"◈";font-size:9px}
.pr-tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:13px;width:100%;text-align:left;margin-bottom:9px}
.pr-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.pr-cab b{font-size:15px;font-weight:600;min-width:0;word-break:break-word}
.pr-cab em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:12px;
  font-weight:600;color:var(--ink);flex:none}
.barra{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:8px}
.barra i{display:block;height:100%;background:var(--pine);border-radius:99px;transition:width .3s}
.pr-pie{display:flex;flex-wrap:wrap;gap:6px}
.pr-pie span{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.05em;
  color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.pr-panel .cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pr-panel .cifra{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:11px 8px;text-align:center}
.pr-panel .cifra b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:20px;letter-spacing:-.03em;line-height:1.15}
.pr-panel .cifra span{font-family:"JetBrains Mono",monospace;font-size:8.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pr-sec{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:9px}
.pr-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.pr-linea{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;
  border-bottom:1px solid var(--line)}
.pr-linea:last-child{border-bottom:none}
.pr-linea i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pr-linea .t{flex:1;min-width:0;font-size:14px;word-break:break-word}
.pr-linea.ok .t{text-decoration:line-through;color:var(--muted)}
.pr-linea .x{flex:none;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted)}


/* ---------- Pegar texto ---------- */
.pg-area{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);outline:none;font-size:15px;
  line-height:1.5;resize:vertical;font-family:inherit}
.pg-area:focus{border-color:var(--pine)}
.pg-tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.pg-tipo{padding:10px 4px;border:1px solid var(--line);border-radius:11px;background:var(--paper);
  font-size:12.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:4px}
.pg-tipo b{font-size:15px;font-weight:400}
.pg-tipo[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pg-leido{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:14px}
.pg-leido .t{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.pg-dato{display:flex;gap:9px;padding:3px 0;font-size:13.5px}
.pg-dato span{flex:none;width:34%;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.pg-dato b{flex:1;min-width:0;font-weight:500;word-break:break-word}


/* ---------- Imagen y lectura ---------- */
.pg-acciones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px}
.pg-bt{padding:11px 4px;border:1px solid var(--line);border-radius:11px;background:var(--paper);
  font-size:12px;font-weight:500;color:var(--ink);display:flex;flex-direction:column;
  align-items:center;gap:5px;line-height:1.2;text-align:center}
.pg-bt svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.8;fill:none}
.pg-bt:disabled{opacity:.45}
.pg-previa{position:relative;margin-bottom:12px;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);background:var(--paper)}
.pg-previa img{display:block;width:100%;max-height:260px;object-fit:contain}
.pg-quitar{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;
  background:rgba(22,34,29,.72);display:grid;place-items:center}
.pg-quitar svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4;fill:none}
.pg-progreso{background:var(--paper);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;margin-bottom:12px}
.pg-progreso .txt{font-family:"JetBrains Mono",monospace;font-size:10.5px;
  letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
.pg-nota{font-size:12px;color:var(--muted);line-height:1.45;margin:-4px 0 12px}
.comprobante{margin-bottom:15px}
.comprobante img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;
  border:1px solid var(--line);background:var(--paper);display:block}
.comprobante .quitar{margin-top:7px;font-size:12.5px;color:var(--oxblood);font-weight:500}
.ev-clip,.task-clip{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted)}


/* ---------- Gastos ---------- */
.gt-top{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.gt-caja{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:13px}
.gt-caja span{display:block;font-family:"JetBrains Mono",monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.gt-caja b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:23px;
  letter-spacing:-.03em;line-height:1.1;display:block}
.gt-caja em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted)}
.barras{display:flex;align-items:flex-end;gap:5px;height:110px;margin:4px 0 6px}
.col-mes{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:5px;min-width:0;height:100%}
.col-mes .tallo{width:100%;background:var(--pine);border-radius:5px 5px 0 0;min-height:2px;
  transition:height .3s;position:relative}
.col-mes.act .tallo{background:var(--gold)}
.col-mes .et{font-family:"JetBrains Mono",monospace;font-size:8.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden}
.col-mes .val{font-family:"JetBrains Mono",monospace;font-size:8.5px;font-weight:600;
  color:var(--ink);white-space:nowrap}
.rep{margin-bottom:4px}
.rep-fila{display:flex;align-items:center;gap:9px;padding:7px 0}
.rep-fila i{flex:none;width:9px;height:9px;border-radius:3px}
.rep-fila .n{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-fila .v{flex:none;font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:600}
.rep-fila .pc{flex:none;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);width:34px;text-align:right}
.rep-barra{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:-3px;margin-bottom:3px}
.rep-barra i{display:block;height:100%;border-radius:99px}
.gar-fila{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.gar-fila .n{flex:1;min-width:0}
.gar-fila .n b{display:block;font-size:14px;font-weight:500;word-break:break-word}
.gar-fila .n span{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);margin-top:2px}
.gar-fila .q{flex:none;font-family:"JetBrains Mono",monospace;font-size:10.5px;
  border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--pine)}
.gar-fila .q.cerca{color:var(--gold);border-color:rgba(176,128,42,.4)}
.gar-fila .q.venc{color:var(--muted)}


/* ---------- Bloques del menú de copias ---------- */
.grupo-op{border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:12px;background:var(--surface)}
.grupo-op > .cab{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.grupo-op > .cab b{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:400}
.grupo-op > .cab .sello{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--pine);border:1px solid rgba(44,95,74,.35);
  border-radius:99px;padding:1px 7px}
.grupo-op .op{margin-bottom:7px;background:var(--paper)}
.grupo-op .op:last-child{margin-bottom:0}
.anios{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.chip-anio{padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);
  font-size:14.5px;font-weight:500;display:flex;align-items:baseline;gap:7px}
.chip-anio span{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted)}
.chip-anio[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip-anio[aria-pressed="true"] span{color:rgba(255,255,255,.7)}
.grupo-op > .pie{font-size:12px;color:var(--muted);line-height:1.45;margin-top:9px;padding:0 2px}


/* ---------- Cabecera de proyecto en Tareas ---------- */
.proy-cab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px 15px;margin-bottom:18px}
.pc-tit{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;
  letter-spacing:-.025em;margin-bottom:10px}
.pc-datos{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px}
.pc-datos span{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted)}
.pc-datos b{color:var(--ink);font-size:12px}
.pc-enlaces{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.pz{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--pine);
  background:rgba(44,95,74,.09);border-radius:99px;padding:4px 11px;letter-spacing:.03em}

.pie-ayuda{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--muted);
  text-align:center;padding:16px 0 4px;letter-spacing:.06em;line-height:1.7;
  border-top:1px solid var(--line);margin-top:14px}
.pie-ayuda .ver{font-size:12px;color:var(--ink);margin-bottom:3px}
.pie-ayuda .ver b{font-weight:600}

.pie-ver{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.pie-ver .linea{display:flex;justify-content:space-between;gap:12px;padding:5px 0;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted)}
.pie-ver .linea b{color:var(--ink);font-weight:600}
.aviso-ver{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;line-height:1.5}
.aviso-ver.ok{color:var(--pine);border-color:rgba(44,95,74,.3)}
.aviso-ver.nueva{color:var(--gold);border-color:rgba(176,128,42,.4)}
.aviso-ver button{display:block;margin-top:8px;background:var(--ink);color:#fff;
  padding:8px 14px;border-radius:9px;font-size:12px;font-weight:600;font-family:"Instrument Sans",sans-serif}


/* ---------- Inicio: alarma y filas compactas ---------- */
.alarma{display:flex;align-items:flex-start;gap:13px;background:#FFFBF2;
  border:1px solid rgba(176,128,42,.3);border-radius:16px;box-shadow:var(--shadow);
  padding:15px 16px;margin-bottom:18px;width:100%;text-align:left}
.alarma .campana{flex:none;width:40px;height:40px;border-radius:12px;display:grid;
  place-items:center;background:rgba(176,128,42,.12);font-size:19px}
.alarma.suena{border-color:rgba(142,47,38,.4);background:#FFFAF9}
.alarma.suena .campana{background:rgba(142,47,38,.1)}
.alarma .txt{flex:1;min-width:0}
.alarma .txt b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
  font-size:17px;letter-spacing:-.015em;line-height:1.25;margin-bottom:3px}
.alarma.suena .txt b{color:var(--oxblood)}
.alarma .txt span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.alarma .txt .cuenta{font-family:"JetBrains Mono",monospace;font-size:13px;
  color:var(--gold);font-weight:600;letter-spacing:.02em;margin-bottom:1px}
.alarma.suena .txt .cuenta{color:var(--oxblood)}
.alarma .flecha{flex:none;align-self:center;width:16px;height:16px;stroke:var(--muted);
  stroke-width:2;fill:none;opacity:.45}

.p-fila{display:flex;align-items:center;gap:12px;padding:11px 2px;
  border-bottom:1px solid var(--line);width:100%;text-align:left}
.p-fila:last-child{border-bottom:none}
.p-fila .marca{flex:none;width:4px;height:30px;border-radius:99px}
.p-fila .cuerpo{flex:1;min-width:0}
.p-fila .cuerpo b{display:block;font-weight:500;font-size:15px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-fila .cuerpo span{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;
  color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-fila .cuando{flex:none;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
.p-fila .cuando.rojo{color:var(--oxblood);font-weight:600}
.p-check{flex:none;width:18px;height:18px;border-radius:6px;border:1.6px solid var(--line);background:#fff}
.tarj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:3px 14px;margin-bottom:9px}
.sub-rot{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:16px 0 7px 2px}
.sub-rot.rojo{color:var(--oxblood)}
.sub-rot.dia{color:var(--ink);margin-top:10px}

/* Aviso */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 76px);
  transform:translate(-50%,14px);z-index:60;background:var(--ink);color:#fff;padding:10px 17px;
  border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:86vw;display:flex;align-items:center;gap:14px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.toast-undo{flex:none;color:#9BD8B4;font-weight:600;font-size:13.5px;
  border-left:1px solid rgba(255,255,255,.2);padding-left:14px}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="top-row">
    <div class="brand" id="brand"><span class="rosa">🧭</span> Tareas</div>
    <div style="display:flex;align-items:center;gap:7px">
      <div class="tally" id="tally"></div>
      <button id="gastosBtn" aria-label="Gastos"
        style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--ink);stroke-width:1.8;fill:none">
          <circle cx="12" cy="12" r="8"/>
          <path d="M14.3 9.3a3 3 0 1 0 0 5.4M8.7 11h4M8.7 13h4" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="pegarBtn" aria-label="Pegar texto"
        style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--ink);stroke-width:1.8;fill:none">
          <rect x="7" y="4" width="10" height="16" rx="2"/><path d="M10 4V3h4v1" stroke-linejoin="round"/>
          <path d="M10 10h4M10 14h4" stroke-linecap="round"/></svg>
      </button>
      <button id="menuBtn" aria-label="Copias y exportar"
        style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--ink);stroke-width:1.9;fill:none">
          <path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <div class="store-state"><i class="store-dot" id="dot"></i><span id="storeTxt">comprobando…</span></div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="view" id="view-tareas"></div>
  <div class="view" id="view-eventos"></div>
  <div class="view" id="view-notas"></div>
  <div class="view" id="view-datos"></div>
  <div class="view on" id="view-inicio"></div>
</main>

<div class="composer">
  <div class="composer-in">
    <input id="quick" type="text" placeholder="Añadir tarea" autocomplete="off" enterkeyhint="done">
    <button class="send" id="listaBtn" style="background:var(--pine);display:none" aria-label="Nueva lista">
      <svg viewBox="0 0 24 24"><path d="m3 7 1.6 1.6L7.8 5.4M3 17l1.6 1.6 3.2-3.2M12 7h9M12 17h9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="send" id="quickBtn" aria-label="Añadir">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<script>
/* ============================================================
   ALMACENAMIENTO — pieza aislada.
   Hoy: window.storage (Claude). Mañana: IndexedDB (PWA).
   Solo hay que reescribir load() y save().
   ============================================================ */
const Store = {
  persistente:false,
  permanente:false,
  motor:'memoria',        // 'claude' | 'navegador' | 'memoria'
  _db:null,
  _mem:{},

  // Base del navegador (IndexedDB): lo que se usará en GitHub Pages / PWA
  _abrir(){
    return new Promise((ok, mal) => {
      if(this._db) return ok(this._db);
      if(!self.indexedDB) return mal('sin indexedDB');
      const p = indexedDB.open('mivida', 1);
      p.onupgradeneeded = () => p.result.createObjectStore('datos');
      p.onsuccess = () => { this._db = p.result; ok(this._db); };
      p.onerror = () => mal(p.error);
    });
  },
  _leerIDB(k){
    return this._abrir().then(db => new Promise((ok, mal) => {
      const t = db.transaction('datos','readonly').objectStore('datos').get(k);
      t.onsuccess = () => ok(t.result ?? null);
      t.onerror = () => mal(t.error);
    }));
  },
  _grabarIDB(k, v){
    return this._abrir().then(db => new Promise((ok, mal) => {
      const t = db.transaction('datos','readwrite').objectStore('datos').put(v, k);
      t.onsuccess = () => ok(true);
      t.onerror = () => mal(t.error);
    }));
  },

  // Pedimos al navegador que no borre estos datos por su cuenta.
  // Ojo: no protege si el usuario borra los datos de navegación a mano.
  async pedirPermanencia(){
    try{
      if(navigator.storage && navigator.storage.persist){
        this.permanente = await navigator.storage.persisted();
        if(!this.permanente) this.permanente = await navigator.storage.persist();
      }
    }catch(e){}
  },

  async load(key){
    const k = 'bitacora:' + key;
    const viejo = 'mivida:' + key;   // datos guardados antes del cambio de nombre
    // 1) Almacenamiento de Claude
    try{
      const r = await window.storage.get(k);
      this.persistente = true; this.motor = 'claude';
      if(r && r.value) return JSON.parse(r.value);
      const a = await window.storage.get(viejo);          // traspaso desde el nombre antiguo
      if(a && a.value){ await window.storage.set(k, a.value); return JSON.parse(a.value); }
      return null;
    }catch(e){}
    // 2) Base del navegador
    try{
      const v = await this._leerIDB(k);
      this.persistente = true; this.motor = 'navegador';
      if(v) return JSON.parse(v);
      const a = await this._leerIDB(viejo);               // traspaso desde el nombre antiguo
      if(a){ await this._grabarIDB(k, a); return JSON.parse(a); }
      return null;
    }catch(e){}
    // 3) Solo memoria (se pierde al cerrar)
    this.motor = 'memoria';
    return this._mem[k] ? JSON.parse(this._mem[k]) : null;
  },

  async save(key, data){
    const k = 'bitacora:' + key, v = JSON.stringify(data);
    this._mem[k] = v;
    try{
      await window.storage.set(k, v);
      this.persistente = true; this.motor = 'claude'; pintarEstado(); return;
    }catch(e){}
    try{
      await this._grabarIDB(k, v);
      this.persistente = true; this.motor = 'navegador'; pintarEstado(); return;
    }catch(e){}
    this.persistente = false; this.motor = 'memoria'; pintarEstado();
  }
};

/* ---------- Estado ---------- */
let vista = 'inicio';
let tareas = [], eventos = [], notas = [], fichas = [], vacia = false;
let filtroT = 'todas', modoE = 'mes', filtroN = 'todas', filtroD = 'todas', proyTareas = 'todas';

  'Trámites','Finanzas','Compras','Ocio','Películas','Recetas','Documentos','Medidas','Personal'];

let catPersonal = {colores:{}, iconos:{}, extra:[]};

// Un campo abierto: eliges de la lista o escribes una nueva

};

// A las de serie se suman las que hayas escrito tú
function categorias(){

  notas.forEach(n => { if(n.categoria) usadas.add(n.categoria); else if(n.etiqueta) usadas.add(n.etiqueta); });
  const extra = [...usadas, ...catPersonal.extra].filter(c => c && c !== 'Sin categoría' && !CATEGORIAS_BASE.includes(c));
  return [...CATEGORIAS_BASE, ...[...new Set(extra)].sort()];
}

const VERSION_APP = 'v53';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Fechas ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoyISO = () => { const d=new Date(); d.setHours(0,0,0,0); return iso(d); };
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function dias(f){ if(!f) return null; return Math.round((new Date(f+'T00:00:00') - new Date(hoyISO()+'T00:00:00'))/864e5); }
const eur = n => (n||n===0) ? new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n) : '';

function etiquetaGrupo(f){
  const d = dias(f);
  if(d===null) return {dia:'—', txt:'sin fecha', cls:''};
  const fecha = new Date(f+'T00:00:00'), num = fecha.getDate(), m = MESES[fecha.getMonth()];
  if(d === -1) return {dia:num, txt:`${m} · ayer`, cls:'late'};
  if(d < 0) return {dia:num, txt:`${m} · ${DIAS[fecha.getDay()]}`, cls:'late'};
  if(d === 0) return {dia:num, txt:`${m} · hoy`, cls:'today'};
  if(d === 1) return {dia:num, txt:`${m} · mañana`, cls:''};
  if(d < 7) return {dia:num, txt:`${m} · ${DIAS[fecha.getDay()]}`, cls:''};
  return {dia:num, txt:`${m} ${fecha.getFullYear()}`, cls:''};
}

/* ---------- Repeticiones ---------- */
const REPETICIONES = [
  {k:'no',       l:'No se repite'},
  {k:'semanal',  l:'Cada semana'},
  {k:'quincenal',l:'Cada 2 semanas'},
  {k:'mensual',  l:'Cada mes'},
  {k:'trimestral',l:'Cada 3 meses'},
  {k:'semestral',l:'Cada 6 meses'},
  {k:'anual',    l:'Cada año'}
];
const REP_TEXTO = k => (REPETICIONES.find(r => r.k === k) || REPETICIONES[0]).l;

// Compatibilidad con los eventos que se guardaron con el campo antiguo
const repDe = ev => ev.repite || (ev.anual ? 'anual' : 'no');

// Próxima vez que toca, contando desde hoy
function fechaEfectiva(ev){
  const rep = repDe(ev);
  if(rep === 'no' || !ev.fecha) return ev.fecha;
  const base = new Date(ev.fecha+'T00:00:00');
  const hoy = new Date(hoyISO()+'T00:00:00');
  if(base >= hoy) return ev.fecha;

  const f = new Date(base);
  let vueltas = 0;
  while(f < hoy && vueltas < 600){
    if(rep === 'semanal') f.setDate(f.getDate()+7);
    else if(rep === 'quincenal') f.setDate(f.getDate()+14);
    else if(rep === 'mensual') f.setMonth(f.getMonth()+1);
    else if(rep === 'trimestral') f.setMonth(f.getMonth()+3);
    else if(rep === 'semestral') f.setMonth(f.getMonth()+6);
    else f.setFullYear(f.getFullYear()+1);
    vueltas++;
  }
  return iso(f);
}

/* ---------- Consultas ---------- */
const padres = () => tareas.filter(t => !t.parentId);
const hijas = id => tareas.filter(t => t.parentId === id);

function pasaFiltroT(t){
  const d = dias(t.fechaLimite);
  if(filtroT === 'hoy') return d === 0;
  if(filtroT === 'semana') return d !== null && d >= 0 && d < 7;
  if(filtroT === 'atrasadas') return d !== null && d < 0;
  if(filtroT === 'sinfecha') return d === null;
  return true;
}
function sumaDias(f,n){ const d = new Date(f+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }

// Colores por categoría (barra, punto y bloque horario)
const COLOR_CAT = {
  casa:'#3E6E8E', marines:'#2C5F4A', coche:'#B0802A', familia:'#8A9B4F', salud:'#8E2F26',
  trabajo:'#4A5D8A', 'trámites':'#5C7A6E', tramites:'#5C7A6E', finanzas:'#2F6F8F',
  compras:'#6F5FA8', ocio:'#C2743F', 'películas':'#9B4A6B', peliculas:'#9B4A6B',
  recetas:'#A8632F', documentos:'#6B6F7A', medidas:'#4E7A6A', personal:'#3E8A82'
};
// Las categorías que añadas tú reciben un color estable, sacado de su nombre
function colorCat(c){
  const k = (c||'').toLowerCase();
  if(catPersonal.colores[k]) return catPersonal.colores[k];
  if(COLOR_CAT[k]) return COLOR_CAT[k];
  if(!k || k === 'sin categoría') return '#6E7B74';
  let h = 0;
  for(const ch of k) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 34% 42%)`;
}
// Para el selector de color (input type=color), que solo admite formato #rrggbb
function hexColorCat(c){
  const v = colorCat(c);
  if(v.startsWith('#')) return v;
  const m = v.match(/hsl\((\d+) (\d+)% (\d+)%\)/);
  if(!m) return '#6E7B74';
  const [h,s,l] = [+m[1], +m[2]/100, +m[3]/100];
  const a = s * Math.min(l, 1-l);
  const f = n => {
    const k2 = (n + h/30) % 12;
    const col = l - a * Math.max(Math.min(k2-3, 9-k2, 1), -1);
    return Math.round(255*col).toString(16).padStart(2,'0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

// Días visibles según el modo
function diasVisibles(){
  if(modoE === 'dia') return [calSel];
  if(modoE === 'tres') return [calSel, sumaDias(calSel,1), sumaDias(calSel,2)];
  return null; // mes
}

// Eventos del mes que se muestra (para la agenda de abajo)
// Cada entrada lleva pegada la fecha exacta de ESA ocurrencia (campo _f),
// que puede ser de este año, de uno anterior o de uno futuro si se repite.
function eventosDelMes(){
  const ultimo = new Date(calAnio, calMes+1, 0).getDate();
  const out = [], vistos = new Set();
  for(let d = 1; d <= ultimo; d++){
    const f = `${calAnio}-${String(calMes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    eventos.forEach(e => {
      if(!abarca(e, f)) return;
      const k = e.id + '|' + f;
      if(vistos.has(k)) return;
      vistos.add(k);
      out.push(Object.assign({}, e, {_f: f}));
    });
  }
  return out.sort((a,b) => (a._f+(a.hora?'1'+a.hora:'0')).localeCompare(b._f+(b.hora?'1'+b.hora:'0')));
}
// ¿Cae este evento exactamente en el día f? Vale para cualquier ocurrencia,
// pasada o futura, a diferencia de fechaEfectiva (que solo mira hacia adelante).
function ocurreEn(e, f){
  if(!e.fecha) return false;
  const rep = repDe(e);
  if(rep === 'no') return e.fecha === f;
  if(f < e.fecha) return false;   // no hay ocurrencias antes de que se creara

  if(rep === 'anual'){
    // Mismo mes y día, cualquier año a partir del de creación
    return f.slice(5) === e.fecha.slice(5);
  }
  const base = new Date(e.fecha+'T00:00:00'), dia = new Date(f+'T00:00:00');
  if(rep === 'semanal')   return (dia - base) % (7  * 864e5) === 0;
  if(rep === 'quincenal') return (dia - base) % (14 * 864e5) === 0;
  // mensual / trimestral / semestral: mismo día del mes, a intervalos de N meses
  if(dia.getDate() !== base.getDate()) return false;
  const meses = (dia.getFullYear()-base.getFullYear())*12 + (dia.getMonth()-base.getMonth());
  if(meses < 0) return false;
  if(rep === 'mensual')    return true;
  if(rep === 'trimestral') return meses % 3 === 0;
  if(rep === 'semestral')  return meses % 6 === 0;
  return false;
}

// Un evento puede abarcar varios días: sale en todos ellos, aunque se repita
function abarca(e, f){
  if(!e.fecha) return false;
  if(!e.fechaFin || e.fechaFin <= e.fecha) return ocurreEn(e, f);
  const dur = Math.round((new Date(e.fechaFin+'T00:00:00') - new Date(e.fecha+'T00:00:00')) / 864e5);
  for(let i = 0; i <= dur; i++){
    const ini = iso(new Date(new Date(f+'T00:00:00').getTime() - i*864e5));
    if(ocurreEn(e, ini)) return true;
  }
  return false;
}
const duraDias = e => {
  if(!e.fechaFin || !e.fecha || e.fechaFin <= e.fecha) return 1;
  return Math.round((new Date(e.fechaFin+'T00:00:00') - new Date(e.fecha+'T00:00:00')) / 864e5) + 1;
};
const diaDe = (e, f) => {
  const ini = fechaEfectiva(e);
  return Math.round((new Date(f+'T00:00:00') - new Date(ini+'T00:00:00')) / 864e5) + 1;
};

// Los de todo el día van primero, como en cualquier calendario
const eventosDe = f => eventos.filter(e => abarca(e, f))
  .sort((a,b) => (a.hora ? 1 : 0) - (b.hora ? 1 : 0) || (a.hora||'').localeCompare(b.hora||''));

// Cada guardado deja constancia de cuándo fue, para poder comparar qué copia es más nueva
let ultimaEdicion = null;
async function marcarEdicion(){ ultimaEdicion = new Date().toISOString(); await Store.save('ultimaEdicion:v1', ultimaEdicion); }

async function persistirT(){ await Store.save('tareas:v1', tareas); await marcarEdicion(); }

async function persistirD(){ await Store.save('fichas:v1', fichas); await marcarEdicion(); }

const COLORES_NOTA = [
  {k:'bone',  c:'#FFFFFF'}, {k:'sage', c:'#E3EBE1'}, {k:'arena', c:'#F3E9D6'},
  {k:'rosa',  c:'#F3E1DC'}, {k:'cielo',c:'#DFE9F1'}, {k:'lila',  c:'#E7E1F1'},
  {k:'menta', c:'#DBEBE2'}, {k:'ocre', c:'#EFE4C9'}
];
const colorNota = k => (COLORES_NOTA.find(x => x.k === k) || COLORES_NOTA[0]).c;


/* ============================================================
   RENDER COMÚN
   ============================================================ */
function pintarEstado(){
  const ok = Store.persistente;
  const dot = document.getElementById('dot');
  dot.classList.toggle('ok', ok);
  let txt = {
    claude:    'guardado en tu cuenta · sincroniza entre dispositivos',
    navegador: 'guardado en este dispositivo',
    memoria:   'sin guardar · haz una copia antes de cerrar'
  }[Store.motor];

  // Si hace mucho de la última copia, lo decimos aquí mismo
  const d = diasSinCopia();
  if(Store.motor === 'navegador' && d !== null && d >= 7){
    txt = d > 60 ? 'sin copia desde hace meses · descárgala' : `sin copia desde hace ${d} días`;
    dot.classList.remove('ok');
  } else if(Store.motor === 'navegador' && d === null){
    txt = 'guardado aquí · nunca has hecho una copia';
    dot.classList.remove('ok');
  }
  document.getElementById('storeTxt').textContent = txt;
}

let ultimaCopia = null;
function diasSinCopia(){
  if(!ultimaCopia) return null;
  return Math.floor((Date.now() - new Date(ultimaCopia)) / 864e5);
}
async function marcarCopia(){
  ultimaCopia = new Date().toISOString();
  await Store.save('copia:v1', ultimaCopia);
  pintarEstado();
}

function render(){
  pintarEstado();
  const nombres = {inicio:'Hoy', tareas:'Tareas', eventos:'Eventos', notas:'Notas', datos:'Datos'};
  const placeholders = {inicio:'Añadir tarea… "mañana 10:00"', tareas:'Añadir tarea… "el jueves"', eventos:'Añadir evento… "mañana 16:15"', notas:'Título de la nota…', datos:'Nueva ficha'};

    document.getElementById('view-'+v).classList.toggle('on', vista===v));

}

/* ============================================================
   TAREAS

function chipsTareas(){
  const proys = proyectos();
  const pend = p => padres().filter(t => t.estado !== 'hecha' &&
    (p === 'todas' ? true : p === 'sin' ? !t.proyecto : t.proyecto === p)).length;
  const sinProy = padres().filter(t => t.estado !== 'hecha' && !t.proyecto).length;

  let html = `<button class="chip" data-fp="todas" aria-pressed="${proyTareas==='todas'}">Todas<span class="n">${pend('todas')}</span></button>`;
  html += proys.map(p => `<button class="chip" data-fp="${esc(p)}" aria-pressed="${proyTareas===p}">
    ${esc(p)}${pend(p) ? `<span class="n">${pend(p)}</span>` : ''}</button>`).join('');
  if(sinProy) html += `<button class="chip" data-fp="sin" aria-pressed="${proyTareas==='sin'}">Sin proyecto<span class="n">${sinProy}</span></button>`;

        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke-linecap="round"/></svg>
      ${activo ? {hoy:'Hoy', semana:'7 días', atrasadas:'Atrasadas', sinfecha:'Sin fecha'}[filtroT] : 'Fecha'}</button>`;

  document.getElementById('chips').innerHTML = html;
