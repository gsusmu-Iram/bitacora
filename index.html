}

function menuFecha(){
  editando = null;
  const defs = [['todas','Cualquier fecha'],['hoy','Hoy'],['semana','Próximos 7 días'],
                ['atrasadas','Atrasadas'],['sinfecha','Sin fecha']];
  const cuenta = f => { const g=filtroT; filtroT=f;
    const n = padres().filter(t => t.estado!=='hecha' && pasaFiltroT(t) && pasaProyecto(t)).length;
    filtroT=g; return n; };
  abrirSheet(`<div class="grip"></div><h2>Filtrar por fecha</h2>
    ${defs.map(([k,l]) => `<button class="op" data-fecha="${k}"
      style="${filtroT===k?'border-color:var(--ink);background:var(--surface)':''}">
      <i>${filtroT===k?'✓':'·'}</i><div><b>${l}</b></div>
      <span style="flex:none;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)">${cuenta(k)}</span>
    </button>`).join('')}`);
  document.querySelectorAll('#sheet [data-fecha]').forEach(b => b.onclick = () => {
    filtroT = b.dataset.fecha; cerrarSheet(); render();
  });
}

const pasaProyecto = t => proyTareas === 'todas' ? true
  : proyTareas === 'sin' ? !t.proyecto : t.proyecto === proyTareas;

function filaSub(s){
  return `<div class="sub ${s.estado==='hecha'?'done':''}">
    <button class="box" data-check="${s.id}" aria-label="Completar"><svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="body" data-editt="${s.id}"><div class="title">${esc(s.titulo)}</div></button>
  </div>`;
}

function filaTarea(t){
  const subs = hijas(t.id), listas = subs.filter(s=>s.estado==='hecha').length, meta = [];
  if(t.categoria && t.categoria!=='Sin categoría') meta.push(`<span>${esc(t.categoria)}</span>`);
  if(t.prioridad && t.prioridad!=='Baja') meta.push(`<span class="pri ${t.prioridad.toLowerCase()}">${t.prioridad}</span>`);
  if(t.notas) meta.push(`<span>nota</span>`);
  if(t.imagen) meta.push(`<span>📎</span>`);
  if(t.privado) meta.push(`<span>🔒</span>`);
  if(t.enInicio) meta.push(`<span>🧭</span>`);
  if(t.proyecto) meta.push(`<span class="pr-chip" data-verproy="${esc(t.proyecto)}">${esc(t.proyecto)}</span>`);
  return `<article class="task ${t.estado==='hecha'?'done':''} ${abiertas.has(t.id)?'open':''} ${recien===t.id?'recien':''}">
    <div class="task-main">
      <button class="box" data-check="${t.id}" aria-label="Completar"><svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="body" data-editt="${t.id}">
        <div class="title">${esc(t.titulo)}</div>
        ${meta.length?`<div class="meta">${meta.join('<span class="dot-sep">·</span>')}</div>`:''}
      </button>
      <button class="prog" data-toggle="${t.id}" aria-label="Ver subtareas">
        ${subs.length?`${listas}/${subs.length}`:''}
        <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="subs">${subs.map(filaSub).join('')}
      <button class="add-sub" data-addsub="${t.id}"><b>+</b> Añadir subtarea</button></div>
  </article>`;
}

function renderTareas(){
  chipsTareas();
  const activas = padres().filter(t => t.estado !== 'hecha' && pasaFiltroT(t) && pasaProyecto(t));
  const hechas = padres().filter(t => t.estado === 'hecha' && pasaProyecto(t));
  document.getElementById('tally').textContent = `${activas.length} PENDIENTES`;
  const el = document.getElementById('view-tareas');

  // Al elegir un proyecto, la pantalla se convierte en ese proyecto
  let cabecera = '';
  if(proyTareas !== 'todas' && proyTareas !== 'sin'){
    const r = resumenProyecto(proyTareas);
    const enlaces = [];
    if(r.ev.length) enlaces.push(`<button class="pz" data-pz-ev="${esc(proyTareas)}">${r.ev.length} evento${r.ev.length>1?'s':''}</button>`);
    if(r.no.length) enlaces.push(`<button class="pz" data-pz-no="${esc(proyTareas)}">${r.no.length} nota${r.no.length>1?'s':''}</button>`);
    if(r.fi.length) enlaces.push(`<button class="pz" data-pz-fi="${esc(proyTareas)}">${r.fi.length} ficha${r.fi.length>1?'s':''}</button>`);
    cabecera = `<div class="proy-cab">
      <div class="pc-tit">${esc(proyTareas)}</div>
      <div class="barra" style="height:6px"><i style="width:${r.pct}%"></i></div>
      <div class="pc-datos">
        <span><b>${r.hechas}/${r.ta.length}</b> tareas</span>
        ${r.gasto ? `<span><b>${eur(r.gasto)}</b> gastados</span>` : ''}
        ${r.material.length ? `<span><b>${r.material.length}</b> por comprar</span>` : ''}
      </div>
      ${enlaces.length ? `<div class="pc-enlaces">${enlaces.join('')}</div>` : ''}
    </div>`;
  }

  if(!activas.length && !hechas.length){
    el.innerHTML = cabecera + `<div class="empty"><h2>Nada por aquí</h2><p>Escribe abajo tu primera tarea.</p></div>`;
    enlazarT(); return;
  }
  if(!activas.length){
    el.innerHTML = cabecera + `<div class="empty"><h2>Todo al día</h2><p>No queda nada pendiente aquí.</p></div>` + bloqueHechas(hechas);
    enlazarT(); return;
  }
  const g = {};
  activas.forEach(t => { const k = t.fechaLimite || 'zzz'; (g[k] = g[k] || []).push(t); });
  el.innerHTML = cabecera + Object.keys(g).sort().map(k => {
    const e = etiquetaGrupo(k === 'zzz' ? null : k);
    return `<section class="group ${e.cls}">
      <div class="group-head"><div class="gday">${e.dia}</div><div class="glabel">${e.txt}</div></div>
      <div class="spine">${g[k].map(filaTarea).join('')}</div></section>`;
  }).join('') + bloqueHechas(hechas);
  enlazarT();
}

function bloqueHechas(h){
  if(!h.length) return '';
  return `<button class="done-toggle" data-verhechas><span>Hechas · ${h.length}</span><span>${verHechas?'ocultar':'ver'}</span></button>`
   + (verHechas ? `<div class="spine" style="border:none;padding-left:0">${h.map(filaTarea).join('')}</div>` : '');
}

function enlazarT(){
  const el = document.getElementById('view-tareas');
  el.querySelectorAll('[data-check]').forEach(b => b.onclick = e => { e.stopPropagation(); marcar(b.dataset.check); });
  el.querySelectorAll('[data-toggle]').forEach(b => b.onclick = e => { e.stopPropagation();
    const id=b.dataset.toggle; abiertas.has(id)?abiertas.delete(id):abiertas.add(id); render(); });
  el.querySelectorAll('[data-editt]').forEach(b => b.onclick = e => { e.stopPropagation(); sheetTarea(b.dataset.editt); });
  el.querySelectorAll('[data-addsub]').forEach(b => b.onclick = e => { e.stopPropagation(); nuevaSub(b.dataset.addsub); });
  el.querySelectorAll('[data-verproy]').forEach(b => b.onclick = e => { e.stopPropagation(); verProyecto(b.dataset.verproy); });
  const v = el.querySelector('[data-verhechas]');
  if(v) v.onclick = () => { verHechas = !verHechas; render(); };
  const ir = (sel, fn) => { const b = el.querySelector(sel); if(b) b.onclick = () => fn(b.dataset); };
  ir('[data-pz-ev]', d => { consulta = d.pzEv; irA('eventos'); abrirBuscador(); });
  ir('[data-pz-no]', d => { filtroN = 'todas'; irA('notas'); consulta = d.pzNo; abrirBuscador(); });
  ir('[data-pz-fi]', d => { filtroD = 'todas'; irA('datos'); consulta = d.pzFi; abrirBuscador(); });
}

async function marcar(id){
  const t = tareas.find(x => x.id === id); if(!t) return;
  if(t.estado === 'hecha'){
    t.estado = 'pendiente';
    if(!t.parentId && t.previo) hijas(t.id).forEach(s => { if(t.previo[s.id]) s.estado = t.previo[s.id]; });
    t.previo = null; render(); await persistirT(); aviso(`Restaurada · ${t.titulo}`);
  } else {
    if(!t.parentId){ t.previo = {}; hijas(t.id).forEach(s => { t.previo[s.id] = s.estado; s.estado = 'hecha'; }); }
    t.estado = 'hecha'; t.completadoEn = new Date().toISOString();
    render(); await persistirT(); aviso(`Hecho · ${t.titulo}`, () => marcar(id));
  }
}

async function crearTarea(titulo, parentId = null){
  const t = { id:uid(), titulo:titulo.trim(), parentId, categoria:'Sin categoría', prioridad:'Media',
    fechaLimite:null, estado:'pendiente', notas:'', creado:new Date().toISOString() };
  tareas.push(t);
  if(parentId){ abiertas.add(parentId); }
  else if(filtroT !== 'todas' && filtroT !== 'sinfecha') filtroT = 'todas';  // si no, la nueva quedaría oculta
  destacar(parentId || t.id);
  render(); await persistirT();
  aviso(`Añadida · ${t.titulo}`);
}
function nuevaSub(p){ const t = prompt('Nueva subtarea:'); if(t && t.trim()) crearTarea(t, p); }

function filaEvento(e, diaCtx){
  const pie = [];
  const largo = duraDias(e);
  if(largo > 1){
    const n = diaCtx ? diaDe(e, diaCtx) : 1;
    const f2 = new Date(iso(new Date(new Date(fechaEfectiva(e)+'T00:00:00').getTime() + (largo-1)*864e5))+'T00:00:00');
    pie.push(`<span class="tramo">día ${n} de ${largo}</span>`);
    if(!diaCtx) pie.push(`<span>hasta el ${f2.getDate()} ${MESES[f2.getMonth()]}</span>`);
  }
  if(e.lugar) pie.push(`<span>${esc(e.lugar)}</span>`);
  if(e.categoria && e.categoria!=='Sin categoría') pie.push(`<span>${esc(e.categoria)}</span>`);
  if(e.ticket) pie.push(`<span>#${esc(e.ticket)}</span>`);
  if(repDe(e) !== 'no') pie.push(`<span>${REP_TEXTO(repDe(e)).toLowerCase()}</span>`);
  if(e.imagen) pie.push(`<span>📎</span>`);
  if(e.enInicio) pie.push(`<span>🧭</span>`);
  if(e.privado) pie.push(`<span>🔒</span>`);
  if(e.proyecto) pie.push(`<span class="pr-chip" data-verproy="${esc(e.proyecto)}">${esc(e.proyecto)}</span>`);
  if(e.garantia){
    const d = dias(e.garantia), fg = new Date(e.garantia+'T00:00:00');
    pie.push(`<span class="tag-gar ${d<0?'venc':''}">${d<0 ? 'garantía vencida'
      : 'garantía → '+fg.getDate()+' '+MESES[fg.getMonth()]+' '+fg.getFullYear()}</span>`);
  }
  return `<button class="ev ${e.estado==='cancelado'?'ev-cancel':''} ${recien===e.id?'recien':''}" data-edite="${e.id}">
    <div class="ev-bar" style="background:${colorCat(e.categoria)}"></div>
    <div class="ev-in">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div style="min-width:0;flex:1">
          <div class="ev-hora">${e.hora ? e.hora : (largo > 1 ? 'VARIOS DÍAS' : 'TODO EL DÍA')}</div>
          <div class="ev-tit" style="color:${colorCat(e.categoria)}">${esc(e.titulo)}</div>
        </div>
        ${(e.coste||e.coste===0)?`<div class="ev-coste">${eur(e.coste)}</div>`:''}
      </div>
      ${pie.length?`<div class="ev-foot">${pie.join('<span class="dot-sep">·</span>')}</div>`:''}
    </div></button>`;
}

const HH = 52;   // alto de cada hora

/* ---------- Año: los 12 meses de un vistazo ---------- */
function diaTieneEvento(f){
  return eventos.some(e => abarca(e, f));
}
function miniMes(mes){
  const primerDia = new Date(calAnio, mes, 1).getDay();
  const ini = primerDia === 0 ? 6 : primerDia - 1;
  const dias = new Date(calAnio, mes+1, 0).getDate();
  const hoy = hoyISO();
  let celdas = '';
  for(let i = 0; i < ini; i++) celdas += `<span class="out"></span>`;
  for(let d = 1; d <= dias; d++){
    const f = `${calAnio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = [f===hoy?'hoy':'', diaTieneEvento(f)?'con-ev':''].filter(Boolean).join(' ');
    celdas += `<button class="${cls}" data-anio-dia="${f}">${d}</button>`;
  }
  return `<div class="mini-mes" data-anio-mes="${mes}">
    <div class="mini-mes-tit">${MESES_L[mes]}</div>
    <div class="mini-mes-grid">${celdas}</div>
  </div>`;
}
function vistaAnio(){
  return `<div class="anio-grid">${MESES_L.map((_,m) => miniMes(m)).join('')}</div>`;
}


/* ---------- Gastos: los eventos con coste, mirados de otra forma ---------- */
const PALETA = ['#2C5F4A','#B0802A','#2F6F8F','#8E2F26','#8A5FA8','#C2743F','#5C7A6E','#7A6A9E'];

function vistaGastos(){
  const conCoste = eventos.filter(e => Number(e.coste));
  if(!conCoste.length){
    return `<div class="empty" style="padding:40px 20px"><h2>Sin gastos anotados</h2>
      <p>Cuando pongas un coste en un evento, aquí verás en qué se te va.</p></div>`;
  }

  const hoy = new Date(), anio = calAnio;
  const delAnio = conCoste.filter(e => (e.fecha||'').startsWith(anio));
  const totalAnio = delAnio.reduce((s,e) => s + Number(e.coste), 0);
  const mesAct = `${anio}-${String(calMes+1).padStart(2,'0')}`;
  const totalMes = conCoste.filter(e => (e.fecha||'').startsWith(mesAct))
    .reduce((s,e) => s + Number(e.coste), 0);
  const media = delAnio.length ? totalAnio / (new Set(delAnio.map(e => e.fecha.slice(0,7))).size) : 0;

  // Doce meses del año que se está mirando
  const porMes = {};
  delAnio.forEach(e => { const m = Number(e.fecha.slice(5,7)) - 1; porMes[m] = (porMes[m]||0) + Number(e.coste); });
  const tope = Math.max(...Object.values(porMes), 1);
  const barras = Array.from({length:12}, (_,m) => {
    const v = porMes[m] || 0;
    const alto = v ? Math.max(4, Math.round(v / tope * 100)) : 2;
    return `<button class="col-mes ${m===calMes?'act':''}" data-mesgasto="${m}">
      <span class="val">${v ? Math.round(v) : ''}</span>
      <span class="tallo" style="height:${alto}%"></span>
      <span class="et">${MESES[m]}</span></button>`;
  }).join('');

  const reparto = (campo, titulo) => {
    const acum = {};
    delAnio.forEach(e => {
      const k = e[campo] || (campo === 'proyecto' ? null : 'Sin categoría');
      if(!k) return;
      acum[k] = (acum[k]||0) + Number(e.coste);
    });
    const lista = Object.entries(acum).sort((a,b) => b[1]-a[1]);
    if(!lista.length) return '';
    const suma = lista.reduce((s,[,v]) => s+v, 0);
    return `<div class="rotulo">${titulo}</div><div class="rep">
      ${lista.map(([k,v],i) => {
        const pc = Math.round(v/suma*100);
        const col = campo === 'categoria' ? colorCat(k) : PALETA[i % PALETA.length];
        return `<div class="rep-fila"><i style="background:${col}"></i>
            <span class="n">${esc(k)}</span>
            <span class="v">${eur(v)}</span><span class="pc">${pc}%</span></div>
          <div class="rep-barra"><i style="width:${pc}%;background:${col}"></i></div>`;
      }).join('')}</div>`;
  };

  const gar = eventos.filter(e => e.garantia)
    .sort((a,b) => a.garantia.localeCompare(b.garantia));
  const bloqueGar = gar.length ? `<div class="rotulo">Garantías</div>
    ${gar.map(e => {
      const d = dias(e.garantia), f = new Date(e.garantia+'T00:00:00');
      const cls = d < 0 ? 'venc' : d < 90 ? 'cerca' : '';
      const txt = d < 0 ? 'vencida' : d < 60 ? `${d} días` : `${Math.round(d/30)} meses`;
      return `<button class="gar-fila" data-edite="${e.id}">
        <span class="n"><b>${esc(e.titulo)}</b>
          <span>hasta ${f.getDate()} ${MESES[f.getMonth()]} ${f.getFullYear()}${e.lugar?' · '+esc(e.lugar):''}</span></span>
        <span class="q ${cls}">${txt}</span></button>`;
    }).join('')}` : '';

  const caros = [...delAnio].sort((a,b) => b.coste - a.coste).slice(0,5);
  const bloqueCaros = caros.length > 1 ? `<div class="rotulo">Lo más caro de ${anio}</div>
    ${caros.map(e => {
      const f = new Date(e.fecha+'T00:00:00');
      return `<button class="gar-fila" data-edite="${e.id}">
        <span class="n"><b>${esc(e.titulo)}</b>
          <span>${f.getDate()} ${MESES[f.getMonth()]}${e.lugar?' · '+esc(e.lugar):''}</span></span>
        <span class="q" style="color:var(--ink);font-weight:600">${eur(e.coste)}</span></button>`;
    }).join('')}` : '';

  return `<div class="gt-top">
      <div class="gt-caja"><span>Total ${anio}</span><b>${eur(totalAnio)}</b>
        <em>${delAnio.length} compra${delAnio.length===1?'':'s'}</em></div>
      <div class="gt-caja"><span>${MESES_L[calMes]}</span><b>${eur(totalMes)}</b>
        <em>media ${eur(media)}/mes</em></div>
    </div>
    <div class="rotulo">Por meses · ${anio}</div>
    <div class="gt-caja" style="margin-bottom:18px"><div class="barras">${barras}</div></div>
    ${reparto('categoria','Por categoría')}
    ${reparto('proyecto','Por proyecto')}
    ${bloqueCaros}
    ${bloqueGar}`;
}

function vistaMes(){
  const primero = new Date(calAnio, calMes, 1);
  const arranque = (primero.getDay() + 6) % 7;
  const total = new Date(calAnio, calMes+1, 0).getDate();
  const conEv = {};
  eventosDelMes().forEach(e => { (conEv[e._f] = conEv[e._f] || []).push(e); });

  let celdas = '';
  for(let i=0;i<arranque;i++) celdas += `<div class="cal-d out"></div>`;
  for(let d=1;d<=total;d++){
    const f = `${calAnio}-${String(calMes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = [f===hoyISO()?'hoy':'', f===calSel?'sel':''].filter(Boolean).join(' ');

    }).join('');
    celdas += `<button class="cal-d ${cls}" data-dia="${f}">${d}
      <span class="ev-barras">${evBarras}</span></button>`;
  }

  const dia = new Date(calSel+'T00:00:00');
  const lista = eventosDe(calSel);
  const detalle = `<div class="dia-sel">
    <div class="cab">${DIAS[dia.getDay()].slice(0,3)} ${dia.getDate()} — ${MESES_L[dia.getMonth()]}</div>
    ${lista.length
      ? lista.map(e => `<button class="mini-ev" data-edite="${e.id}">
          <span class="marca" style="background:${colorCat(e.categoria)}"></span>
          <span class="h">${e.hora || 'TODO EL DÍA'}</span>
          <span class="t">${esc(e.titulo)}</span></button>`).join('')

    <button class="add-dia" data-adddia="${calSel}"><b>+</b> Añadir evento este día</button>
  </div>`;

  return `<div class="cal-grid">${['L','M','X','J','V','S','D'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${celdas}</div>${detalle}`;
}

  const cols = `grid-template-columns:repeat(${n},1fr)`;

  const todoDia = dd.map(f => eventosDe(f).filter(e => !e.hora));
  const franja = todoDia.some(x => x.length) ? `<div class="allday">
    <div class="hueco">TODO<br>EL DÍA</div>
    <div class="cols" style="${cols}">${todoDia.map(evs => `<div class="col">${evs.map(e =>
      `<button class="ad-ev" data-edite="${e.id}" style="background:${colorCat(e.categoria)}">${esc(e.titulo)}</button>`
    ).join('')}</div>`).join('')}</div></div>` : '';

  let horas = '';
  for(let h=H0; h<=H1; h++) horas += `<div>${h}:00</div>`;

  const ahora = new Date();
  const marcaAhora = (ahora.getHours() >= H0 && ahora.getHours() <= H1)
    ? (ahora.getHours()-H0)*HH + (ahora.getMinutes()/60)*HH : null;

  const columnas = dd.map(f => {
    const evs = eventosDe(f).filter(e => e.hora);
    const bloques = evs.map(e => {
      const [h,m] = e.hora.split(':').map(Number);
      const top = Math.max(0, (h-H0)*HH + (m/60)*HH);
      const col = colorCat(e.categoria);
      return `<button class="tg-ev" data-edite="${e.id}"
        style="top:${top}px;height:${HH-6}px;background:${col}">
        <b>${esc(e.titulo)}</b><i>${e.hora}</i></button>`;
    }).join('');
    const linea = (f === hoyISO() && marcaAhora !== null)
      ? `<div class="ahora" style="top:${marcaAhora}px"></div>` : '';
    return `<div class="tg-col ${f===hoyISO()?'hoy':''}">${bloques}${linea}</div>`;
  }).join('');

  return cab + franja + `<div class="tg-wrap" id="tgwrap"><div class="tg">
    <div class="tg-hours">${horas}</div>
    <div class="tg-cols" style="${cols};height:${(H1-H0+1)*HH}px">${columnas}</div>
  </div></div>`;
}

function leyenda(){
  const usadas = [...new Set(eventos.map(e => e.categoria).filter(c => c && c !== 'Sin categoría'))];
  if(!usadas.length) return '';
  return `<div class="leyenda">${usadas.map(c =>
    `<span><i style="background:${colorCat(c)}"></i>${esc(c)}</span>`).join('')}</div>`;
}

function renderEventos(){
  const mes = eventosDelMes();
  const gasto = mes.reduce((s,e) => s + (Number(e.coste)||0), 0);
  document.getElementById('tally').textContent = gasto ? `${mes.length} · ${eur(gasto)}` : `${mes.length} EVENTOS`;

  if(modoE === 'gastos'){
    document.getElementById('view-eventos').innerHTML =
      `<div class="cal">${calHead()}</div>` + vistaGastos();
    enlazarE();
    return;
  }
  if(modoE === 'anio'){
    document.getElementById('view-eventos').innerHTML =
      `<div class="cal">${calHead()}${vistaAnio()}</div>`;
    enlazarE();
    return;
  }

  let html = `<div class="cal">${calHead()}${modoE==='mes' ? vistaMes() : vistaRejilla()}${leyenda()}</div>`;
  html += `<div class="rotulo">Eventos de ${MESES_L[calMes].toLowerCase()}</div>`;

  if(!mes.length){
    html += `<div class="empty"><h2>Mes despejado</h2><p>No hay nada anotado en ${MESES_L[calMes].toLowerCase()}.</p></div>`;
  } else {
    const g = {};
    // eventosDelMes ya trae, en _f, el día exacto de cada ocurrencia dentro del mes
    mes.forEach(e => { (g[e._f] = g[e._f] || []).push(e); });
    html += Object.keys(g).sort().map(k => {
      const t = etiquetaGrupo(k);
      return `<section class="group ${t.cls}">
        <div class="group-head"><div class="gday">${t.dia}</div><div class="glabel">${t.txt}</div></div>
        <div class="spine">${g[k].map(e => filaEvento(e, k)).join('')}</div></section>`;
    }).join('');
  }

  document.getElementById('view-eventos').innerHTML = html;
  enlazarE();
}

function enlazarE(){
  const el = document.getElementById('view-eventos');
  el.querySelectorAll('[data-edite]').forEach(b => b.onclick = () => sheetEvento(b.dataset.edite));
  el.querySelectorAll('[data-verproy]').forEach(b => b.onclick = ev => { ev.stopPropagation(); verProyecto(b.dataset.verproy); });
  el.querySelectorAll('[data-me]').forEach(b => b.onclick = () => {
    modoE = b.dataset.me;
    if(modoE !== 'mes'){ const d = new Date(calSel+'T00:00:00'); calMes = d.getMonth(); calAnio = d.getFullYear(); }
    render();
  });
  el.querySelectorAll('[data-dia]').forEach(b => b.onclick = () => {
    calSel = b.dataset.dia; render();
    setTimeout(() => {
      const det = document.querySelector('.dia-sel');
      if(det) det.scrollIntoView({behavior:'smooth', block:'center'});
    }, 0);
  });
  el.querySelectorAll('[data-anio-dia]').forEach(b => b.onclick = () => {
    const f = b.dataset.anioDia;
    calSel = f; calMes = Number(f.slice(5,7)) - 1; modoE = 'mes'; render();
  });
  el.querySelectorAll('[data-mesgasto]').forEach(b => b.onclick = () => { calMes = Number(b.dataset.mesgasto); render(); });
  el.querySelectorAll('[data-adddia]').forEach(b => b.onclick = () => {
    const t = prompt('Nuevo evento:');
    if(t && t.trim()) crearEvento(t, b.dataset.adddia);
  });
  const w = document.getElementById('tgwrap');
  const dd = diasVisibles();
  if(w && dd){
    const evs = dd.flatMap(f => eventosDe(f)).filter(e => e.hora);
    const h = evs.length ? Math.min(...evs.map(e => Number(e.hora.split(':')[0]))) : new Date().getHours();
    w.scrollTop = Math.max(0, (Math.max(7, h) - 7) * HH - 16);
  }
  el.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => {
    const paso = Number(b.dataset.mes);
    if(modoE === 'gastos' || modoE === 'anio'){ calAnio += paso; render(); return; }
    if(modoE === 'mes'){
      calMes += paso;
      if(calMes < 0){ calMes = 11; calAnio--; } if(calMes > 11){ calMes = 0; calAnio++; }
      const tope = new Date(calAnio, calMes+1, 0).getDate();
      calSel = `${calAnio}-${String(calMes+1).padStart(2,'0')}-${String(Math.min(Number(calSel.slice(8)),tope)).padStart(2,'0')}`;
    } else {
      calSel = sumaDias(calSel, paso * (modoE === 'tres' ? 3 : 1));
      const d = new Date(calSel+'T00:00:00'); calMes = d.getMonth(); calAnio = d.getFullYear();
    }
    render();
  });
}

async function crearEvento(titulo, fecha){
  const f = fecha || calSel || hoyISO();
  const e = { id:uid(), titulo:titulo.trim(), fecha:f, hora:'', todoDia:true, categoria:'Sin categoría',
    lugar:'', ticket:'', coste:null, garantia:'', anual:false, estado:'confirmado', notas:'', creado:new Date().toISOString() };
  eventos.push(e);
  const d = new Date(f+'T00:00:00');          // llevar el calendario al día del evento
  calSel = f; calMes = d.getMonth(); calAnio = d.getFullYear();
  destacar(e.id);
  render(); await persistirE();
  aviso(`Añadido · ${e.titulo}`);
}

/* ============================================================
   INICIO — el resumen del día
   ============================================================ */
function irA(v){
  vista = v;
  document.querySelectorAll('.nav-btn').forEach(x => x.removeAttribute('aria-current'));
  const b = document.querySelector(`.nav-btn[data-view="${v}"]`);
  if(b) b.setAttribute('aria-current','page');
  render();
  requestAnimationFrame(() => window.scrollTo(0,0));
}

function renderInicio(){
  const hoy = hoyISO(), d = new Date(hoy+'T00:00:00');

  // Regla única: lo que tiene fecha entra solo; lo demás lo anclas tú
  const conFecha = [];
  eventos.filter(e => e.estado !== 'cancelado').forEach(e => {
    const f = fechaEfectiva(e);
    if(f) conFecha.push({tipo:'evento', id:e.id, fecha:f, hora:e.hora||'', titulo:e.titulo,
      color:colorCat(e.categoria), extra:e.lugar||'',
      tramo: duraDias(e) > 1 ? `día ${diaDe(e, f >= hoy ? f : hoy)} de ${duraDias(e)}` : ''});
  });
  tareas.filter(t => t.estado !== 'hecha' && t.fechaLimite).forEach(t => {
    const padre = t.parentId ? (tareas.find(x => x.id === t.parentId)||{}).titulo : '';
    conFecha.push({tipo:'tarea', id:t.id, fecha:t.fechaLimite, hora:'', titulo:t.titulo,
      color: t.prioridad==='Alta' ? 'var(--oxblood)' : t.prioridad==='Media' ? 'var(--gold)' : 'var(--muted)',
      extra: padre || t.proyecto || '', alta: t.prioridad==='Alta'});
  });

  const dd = x => dias(x.fecha);
  const deHoy = conFecha.filter(x => dd(x) === 0)
    .sort((a,b) => (a.hora?1:0)-(b.hora?1:0) || (a.hora||'').localeCompare(b.hora||''));
  // Un evento pasado ya ocurrió: no hay nada que confirmar. Solo las tareas vencidas reclaman.
  const vencido = conFecha.filter(x => dd(x) < 0 && x.tipo === 'tarea')
    .sort((a,b) => b.fecha.localeCompare(a.fecha) || (b.alta?1:0)-(a.alta?1:0));
  const semana = conFecha.filter(x => dd(x) > 0 && dd(x) <= 7)
    .sort((a,b) => a.fecha.localeCompare(b.fecha) || (a.hora?1:0)-(b.hora?1:0) || (a.hora||'').localeCompare(b.hora||''));

  const ahoraMs = Date.now();
  // Un evento de hoy con hora ya pasada tampoco reclama: ya ocurrió, igual que uno de ayer.
  // Las tareas y los eventos "todo el día" siguen contando durante toda la jornada.
  const yaPaso = x => x.tipo === 'evento' && x.hora && new Date(x.fecha+'T'+x.hora).getTime() <= ahoraMs;
  const pendienteHoy = deHoy.filter(x => !yaPaso(x));
  const reclaman = pendienteHoy.length + vencido.length;

  // Lo próximo con hora, para poder decir cuánto falta
  const conHora = conFecha
    .filter(x => x.hora && new Date(x.fecha + 'T' + x.hora).getTime() > ahoraMs)
    .sort((a,b) => new Date(a.fecha+'T'+a.hora) - new Date(b.fecha+'T'+b.hora));
  const proximo = conHora[0];
  const cuantoFalta = () => {
    if(!proximo) return '';
    const min = Math.round((new Date(proximo.fecha+'T'+proximo.hora).getTime() - ahoraMs) / 60000);
    if(min < 60) return `faltan ${min} min`;
    const h = Math.floor(min/60), m = min % 60;
    if(h < 24) return `faltan ${h}h${m ? ' ' + m + 'min' : ''}`;
    const d2 = Math.round(h/24);
    return `en ${d2} día${d2 === 1 ? '' : 's'}`;
  };

  // Lo anclado a mano, de cualquier módulo
  const anclado = [
    ...eventos.filter(e => e.enInicio && dias(fechaEfectiva(e)) < 0).map(e => ({t:'evento', o:e})),
    ...tareas.filter(t => t.enInicio && t.estado !== 'hecha').map(t => ({t:'tarea', o:t})),
    ...notas.filter(n => n.enInicio).map(n => ({t:'nota', o:n})),
    ...fichas.filter(f => f.enInicio).map(f => ({t:'ficha', o:f}))
  ];

  document.getElementById('tally').textContent = '';

  const fila = x => {
    const n = dd(x);
    const cuando = n < 0 ? (n === -1 ? 'ayer' : `hace ${-n} d`)
      : x.hora || (x.tipo === 'evento' ? 'todo el día' : '');
    const izq = x.tipo === 'tarea' ? '<span class="p-check"></span>'
      : `<span class="marca" style="background:${x.color}"></span>`;
    const sub = [x.extra, x.tramo].filter(Boolean).join(' · ');
    return `<button class="p-fila" data-abrir-${x.tipo === 'evento' ? 'ev' : 'ta'}="${x.id}">
      ${izq}<span class="cuerpo"><b style="color:${x.tipo==='evento'?x.color:'inherit'}">${esc(x.titulo)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</span>
      <span class="cuando ${n < 0 ? 'rojo' : ''}">${cuando}</span></button>`;
  };

  // ---- La alarma, en una frase ----
  // 'objetivo' es lo que se abre al tocar el banner: siempre debe apuntar a algo,
  // tenga o no cuenta atrás (un cumpleaños de todo el día también hay que poder abrirlo).
  let frase, detalle, marca = '', objetivo = null;
  const hoyMismo = proximo && proximo.fecha === hoy;

  if(reclaman){
    const partes = [];
    if(pendienteHoy.length) partes.push(`${pendienteHoy.length} para hoy`);
    if(vencido.length){
      const v = -dd(vencido[vencido.length - 1]);
      partes.push(`${vencido.length} ${vencido.length===1?'tarea vencida':'tareas vencidas'}${
        v > 1 ? `, la más antigua de hace ${v} días` : ''}`);
    }
    frase = `${reclaman} ${reclaman === 1 ? 'cosa por delante' : 'cosas por delante'}`;
    detalle = partes.join(' · ');
    // Si lo siguiente es hoy y tiene hora, eso manda
    if(hoyMismo){ frase = proximo.titulo; marca = `${cuantoFalta()} · ${proximo.hora}`; objetivo = proximo; }
    // Si solo hay una cosa pendiente, que el toque lleve directo a ella, no al listado genérico
    else if(reclaman === 1){ objetivo = pendienteHoy[0] || vencido[0]; }
  } else {
    const sig = proximo || semana[0];
    if(sig){
      objetivo = sig;
      const f = new Date(sig.fecha+'T00:00:00'), n = dias(sig.fecha);
      if(sig.hora && n <= 1){
        frase = sig.titulo;
        marca = `${cuantoFalta()} · ${n === 1 ? 'mañana ' : ''}${sig.hora}`;
        detalle = '';
      } else {
        frase = 'Nada te reclama hoy';
        // El nombre del día ("es el jueves") solo tiene sentido dentro de la semana.
        // Más lejos, mejor la fecha completa: "es el 7 de enero".
        const cuando = n === 1 ? 'es mañana' : n === 0 ? 'es hoy'
          : n <= 7 ? `es el ${DIAS[f.getDay()]}`
          : `es el ${f.getDate()} de ${MESES_L[f.getMonth()]}${f.getFullYear() !== d.getFullYear() ? ' de ' + f.getFullYear() : ''}`;
        detalle = `Lo siguiente ${cuando}: ${sig.titulo}`;
      }
    } else { frase = 'Nada te reclama hoy'; detalle = 'No tienes nada con fecha por delante'; }
  }

  let html = `<div class="hoy-cab">
    <div class="hoy-fecha">${DIAS[d.getDay()].charAt(0).toUpperCase()+DIAS[d.getDay()].slice(1)}, ${d.getDate()} de ${MESES_L[d.getMonth()].toLowerCase()}</div>
  </div>
  <button class="alarma ${vencido.length ? 'suena' : ''}"
    ${objetivo ? `data-abrir-${objetivo.tipo === 'evento' ? 'ev' : 'ta'}="${objetivo.id}"` : reclaman ? 'data-ir="tareas"' : ''}>
    <span class="campana">${vencido.length ? '🔔' : marca ? '⏱' : '🧭'}</span>
    <span class="txt"><b>${esc(frase)}</b>
      ${marca ? `<span class="cuenta">${esc(marca)}</span>` : ''}
      ${detalle ? `<span>${esc(detalle)}</span>` : ''}</span>
    ${(reclaman || objetivo) ? `<svg class="flecha" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}
  </button>`;

  if(deHoy.length) html += `<div class="sub-rot">Hoy</div><div class="tarj">${deHoy.map(fila).join('')}</div>`;

  if(vencido.length){
    const TOPE = 6;
    const ver = verTodoAhora ? vencido : vencido.slice(0, TOPE);
    const ocultos = vencido.length - ver.length;
    html += `<div class="sub-rot rojo">Vencido · ${vencido.length}</div>
      <div class="tarj">${ver.map(fila).join('')}</div>
      ${ocultos > 0 ? `<button class="ver-mas" data-vermas>Ver ${ocultos} más</button>` : ''}
      ${verTodoAhora && vencido.length > TOPE ? `<button class="ver-mas" data-vermenos>Ver menos</button>` : ''}`;
  }

  if(semana.length){
    const g = {};
    semana.forEach(x => { (g[x.fecha] = g[x.fecha] || []).push(x); });
    html += `<div class="sub-rot">Próximos 7 días</div>`;
    html += Object.keys(g).sort().map(f => {
      const fe = new Date(f+'T00:00:00'), n = dias(f);
      const et = n === 1 ? 'Mañana' : `${DIAS[fe.getDay()].charAt(0).toUpperCase()+DIAS[fe.getDay()].slice(1)} ${fe.getDate()}`;
      return `<div class="sub-rot dia">${et}</div><div class="tarj">${g[f].map(fila).join('')}</div>`;
    }).join('');
  }

  // ---- Un año atrás: qué pasó este mismo día, doce meses antes ----
  const haceUnAnio = iso(new Date(d.getFullYear()-1, d.getMonth(), d.getDate()));
  const recuerdos = [];
  eventos.filter(e => e.estado !== 'cancelado').forEach(e => {
    if(e.fecha === haceUnAnio) recuerdos.push({tipo:'evento', o:e});
  });
  tareas.filter(t => t.estado === 'hecha' && t.completadoEn && t.completadoEn.slice(0,10) === haceUnAnio)
    .forEach(t => recuerdos.push({tipo:'tarea', o:t}));

  if(recuerdos.length){
    html += `<div class="sub-rot">Hace un año</div><div class="tarj">`;
    html += recuerdos.map(({tipo, o}) => {
      if(tipo === 'evento'){
        const extra = [o.lugar, o.coste ? eur(o.coste) : ''].filter(Boolean).join(' · ');
        return `<button class="p-fila" data-abrir-ev="${o.id}">
          <span class="marca" style="background:${colorCat(o.categoria)}"></span>
          <span class="cuerpo"><b style="color:${colorCat(o.categoria)}">${esc(o.titulo)}</b>
            ${extra ? `<span>${esc(extra)}</span>` : ''}</span></button>`;
      }
      return `<button class="p-fila" data-abrir-ta="${o.id}">
        <span class="p-check" style="background:var(--pine);border-color:var(--pine)"></span>
        <span class="cuerpo"><b>${esc(o.titulo)}</b><span>completada ese día</span></span></button>`;
    }).join('');
    html += `</div>`;
  }

  // ---- Lo que has anclado tú: todo como tarjeta, igual que en Notas ----
  if(anclado.length || ACCESOS_INICIO.length){
    const itemsAcceso = ACCESOS_INICIO.map(a => ({tipo:'acceso', key:'acc:'+a.id, o:a}));
    const itemsAnclado = anclado.map(({t, o}) => ({tipo:t, key:t+':'+o.id, o}));
    let fijados = [...itemsAnclado, ...itemsAcceso];
    const orden = ordenFijadoGuardado();
    if(orden.length){
      fijados = fijados.map((it, i) => ({it, i}))
        .sort((a, b) => {
          let ia = orden.indexOf(a.it.key); if(ia < 0) ia = 999 + a.i;
          let ib = orden.indexOf(b.it.key); if(ib < 0) ib = 999 + b.i;
          return ia - ib;
        }).map(x => x.it);
    }

    html += `<div class="sub-rot">Fijado · ${anclado.length}</div><div class="notas">`;

    html += fijados.map(({tipo, key, o}) => {
      if(tipo === 'acceso'){
        const abre = o.href ? `data-href="${esc(o.href)}"` : `data-accion="${o.id}"`;
        return `<div class="nota fij-tile acceso-tile" data-key="${key}" ${abre}>
          <span class="acc-ico">${o.icono}</span><span class="acc-et">${esc(o.titulo)}</span>
        </div>`;
      }
      const t = tipo;
      if(t === 'nota' && o.tipo === 'lista'){
        const falta = (o.items||[]).filter(i => !i.hecho);
        const esCompra = norm(o.categoria||'') === 'compras' || /compra|super|mercado/i.test(o.titulo||'');
        return `<div class="nota fij-tile" data-key="${key}" data-abrir-no="${o.id}" style="background:${colorNota(o.color)}">
          <div class="n-tit">${esc(o.titulo || 'Lista')}</div>
          <div class="n-lista">${falta.slice(0,5).map(i =>
            `<div class="n-li"><i></i><span>${esc(i.txt)}</span></div>`).join('')}
            ${falta.length>5?`<span class="n-mas">+${falta.length-5} más</span>`:''}</div>
          <div class="n-pie"><span class="n-eti">${falta.length} ${esCompra?'por comprar':'sin marcar'}</span></div>
        </div>`;
      }
      if(t === 'nota'){
        return `<div class="nota fij-tile" data-key="${key}" data-abrir-no="${o.id}" style="background:${colorNota(o.color)}">
          ${o.titulo?`<div class="n-tit">${esc(o.titulo)}</div>`:''}
          <div class="n-txt">${limpiar(o.contenido||'')}</div>
        </div>`;
      }
      if(t === 'tarea'){
        return `<div class="nota fij-tile" data-key="${key}" data-abrir-ta="${o.id}">
          <div class="n-tit" style="display:flex;align-items:flex-start;gap:8px">
            <span class="p-check" style="margin-top:2px"></span>${esc(o.titulo)}</div>
          ${o.notas ? `<div class="n-txt">${esc(o.notas)}</div>` : ''}
          <div class="n-pie">
            ${o.proyecto?`<span class="n-eti">◈ ${esc(o.proyecto)}</span>`:''}
            ${o.fechaLimite?`<span class="n-fec">${esc(o.fechaLimite.slice(8,10)+'/'+o.fechaLimite.slice(5,7))}</span>`:''}
          </div>
        </div>`;
      }
      if(t === 'evento'){
        const f = new Date(fechaEfectiva(o)+'T00:00:00');
        return `<div class="nota fij-tile" data-key="${key}" data-abrir-ev="${o.id}">
          <div class="n-tit">${esc(o.titulo)}</div>
          <div class="n-txt">${f.getDate()} ${MESES[f.getMonth()]}${o.lugar?' · '+esc(o.lugar):''}</div>
          <div class="n-pie"><span class="n-fec">${dias(fechaEfectiva(o))<0?'pasado':'próximo'}</span></div>
        </div>`;
      }
      const camp = (o.campos||[]).slice(0,2);
      return `<div class="nota fij-tile" data-key="${key}" data-abrir-fi="${o.id}">
        <div class="n-tit">${iconoCat(o.categoria)} ${esc(o.titulo)}</div>
        ${camp.length?`<div class="n-txt">${camp.map(c=>esc(c.k+': '+c.v)).join('\\n')}</div>`:''}

// Arrastrar y soltar para reordenar los tiles de Fijado (accesos + anclados mezclados).
// Pulsación larga (380ms) activa el arrastre, para no chocar con el toque normal ni con el scroll.
function activarArrastreFijados(){
  const cont = document.querySelector('#view-inicio .notas');
  if(!cont) return;
  let tile = null, startX = 0, startY = 0, timer = null, arrastrando = false, suprimirClick = false;
  const tiles = () => [...cont.querySelectorAll(':scope > .fij-tile')];

  tiles().forEach(el => {
    el.addEventListener('pointerdown', e => {
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      tile = el; startX = e.clientX; startY = e.clientY;
      clearTimeout(timer);
      timer = setTimeout(() => {
        if(!tile) return;
        arrastrando = true;
        try{ tile.setPointerCapture(e.pointerId); }catch(err){}
        tile.classList.add('arrastrando');
      }, 380);
    });
    el.addEventListener('pointermove', e => {
      if(!tile) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(!arrastrando){
        if(Math.abs(dx) > 8 || Math.abs(dy) > 8){ clearTimeout(timer); tile = null; }
        return;
      }
      e.preventDefault();
      tile.style.transform = `translate(${dx}px,${dy}px)`;
      tiles().forEach(other => {
        if(other === tile) return;
        const r = other.getBoundingClientRect();
        if(e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom){
          const ts = tiles();
          if(ts.indexOf(tile) < ts.indexOf(other)) cont.insertBefore(tile, other.nextSibling);
          else cont.insertBefore(tile, other);
          startX = e.clientX; startY = e.clientY;
          tile.style.transform = 'translate(0,0)';
        }
      });
    });
    const soltar = () => {
      clearTimeout(timer);
      if(arrastrando && tile){
        tile.classList.remove('arrastrando');
        tile.style.transform = '';
        guardarOrdenFijado(tiles().map(t => t.dataset.key));
        suprimirClick = true;
        setTimeout(() => { suprimirClick = false; }, 60);
      }
      arrastrando = false; tile = null;
    };
    el.addEventListener('pointerup', soltar);
    el.addEventListener('pointercancel', soltar);
    el.addEventListener('click', e => { if(suprimirClick){ e.stopPropagation(); e.preventDefault(); } }, true);
  });
}

// El contenido con formato es del propio usuario; solo cortamos scripts por seguridad
const limpiar = h => String(h).replace(/<script[\s\S]*?<\/script>/gi,'').replace(/ on\w+="[^"]*"/gi,'');
// Devuelve los símbolos a su forma normal: si no, cada guardado los volvía a escapar
function desescapar(t){
  return String(t||'')
    .replace(/&nbsp;/gi,' ')
    .replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')
    .replace(/&quot;/gi,'"').replace(/&#39;/gi,"'")
    .replace(/&amp;/gi,'&');
}
function soloTexto(h){
  let t = String(h||'')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<\/(p|div|li|h[1-6])>/gi,'\n')
    .replace(/<[^>]+>/g,'');
  // Repetimos por si venía escapado varias veces de versiones anteriores
  for(let i=0; i<4 && /&(amp|nbsp|lt|gt|quot|#39);/i.test(t); i++) t = desescapar(t);
  return t.replace(/\n{3,}/g,'\n\n').trim();
}

    <button class="n-pin" data-pin="${n.id}" aria-label="Fijar">
      <svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z" stroke-linejoin="round"/></svg></button>
    ${n.titulo?`<button style="width:100%;text-align:left" data-editn="${n.id}"><div class="n-tit">${esc(n.titulo)}</div></button>`:''}
    ${n.tipo === 'lista' ? cuerpo : `<button style="width:100%;text-align:left" data-editn="${n.id}">${cuerpo}</button>`}
    ${pie.length?`<button style="width:100%;text-align:left" data-editn="${n.id}"><div class="n-pie">${pie.join('')}</div></button>`:''}

/* ---------- Lo que escribes en la barra de abajo ---------- */
const DIAS_SEM = {domingo:0, lunes:1, martes:2, miercoles:3, 'miércoles':3, jueves:4, viernes:5, sabado:6, 'sábado':6};

// Saca fecha y hora de una frase corta y las quita del título
function interpretarRapido(txt){
  let t = ' ' + txt.trim() + ' ';
  let fecha = '', hora = '';
  const quitar = re => { const m = re.exec(t); if(m){ t = t.replace(m[0], ' '); return m; } return null; };
  const nDias = n => { const d = new Date(); d.setDate(d.getDate()+n); return iso(d); };

  let m;
  if((m = quitar(/\spasado\s+ma[ñn]ana\s/i))) fecha = nDias(2);
  else if((m = quitar(/\s(hoy)\s/i))) fecha = hoyISO();
  else if((m = quitar(/\s(ma[ñn]ana)\s/i))) fecha = nDias(1);
  else if((m = quitar(/\s(?:el\s+)?(lunes|martes|mi[ée]rcoles|jueves|viernes|s[áa]bado|domingo)\s/i))){
    const obj = DIAS_SEM[m[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')];
    const hoy = new Date(hoyISO()+'T00:00:00');
    let saltos = (obj - hoy.getDay() + 7) % 7;
    if(saltos === 0) saltos = 7;
    fecha = nDias(saltos);
  }
  else if((m = quitar(/\s(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\s/))){
    let a = m[3] ? Number(m[3]) : new Date().getFullYear();
    if(a < 100) a += 2000;
    const d = new Date(a, Number(m[2])-1, Number(m[1]));
    if(!m[3] && (new Date(hoyISO()+'T00:00:00') - d) / 864e5 > 180) d.setFullYear(a+1);
    if(Number(m[2]) >= 1 && Number(m[2]) <= 12) fecha = iso(d);
  }
  else if((m = quitar(/\s(?:el\s+)?(\d{1,2})\s+de\s+([a-záéíóú]+)(?:\s+de\s+(\d{4}))?\s/i))){
    const mes = MESES_TXT[m[2].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')];
    if(mes){
      let a = m[3] ? Number(m[3]) : new Date().getFullYear();
      const d = new Date(a, mes-1, Number(m[1]));
      if(!m[3] && (new Date(hoyISO()+'T00:00:00') - d) / 864e5 > 180) d.setFullYear(a+1);
      fecha = iso(d);
    }
  }

  if((m = quitar(/\s(?:a\s+las\s+)?([01]?\d|2[0-3])[:.]([0-5]\d)\s/))) hora = dosDig(m[1]) + ':' + m[2];
  else if((m = quitar(/\sa\s+las\s+([01]?\d|2[0-3])\s/i))) hora = dosDig(m[1]) + ':00';

  const titulo = t.replace(/\s{2,}/g,' ').trim().replace(/[\s,;·-]+$/,'');
  return {titulo: titulo || txt.trim(), fecha, hora};
}

// El formato solo funciona si el cursor está dentro del texto
function aplicarFormato(cmd){
  const cuerpo = document.getElementById('edBody');
  if(!cuerpo) return;
  const sel = window.getSelection();
  if(!sel || !sel.anchorNode || !cuerpo.contains(sel.anchorNode)){
    cuerpo.focus();
    const r = document.createRange();
    r.selectNodeContents(cuerpo);
    r.collapse(false);              // al final del texto
    sel.removeAllRanges(); sel.addRange(r);
  }
  try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
  document.execCommand(cmd, false, null);
  cuerpo.focus();
}

    pintarItems(); await persistirN();
  });
  cont.querySelector('[data-nuevo]').onclick = nuevoItem;
  const l = cont.querySelector('[data-limpiar]');
  if(l) l.onclick = async () => {
    n.items = n.items.filter(i => !i.hecho);
    pintarItems(); await persistirN(); aviso('Marcados borrados');
  };
}

function nuevoItem(){
  const n = notas.find(x => x.id === notaAbierta); if(!n) return;
  n.items = n.items || [];
  n.items.push({id:uid(), txt:'', hecho:false});
  pintarItems();
  const campos = document.querySelectorAll('#edItems [data-txt]');
  if(campos.length) campos[campos.length-1].focus();
}

async function convertirALista(){
  const n = notas.find(x => x.id === notaAbierta); if(!n) return;
  const texto = soloTexto(document.getElementById('edBody').innerHTML);
  n.items = texto.split('\n').map(l => soloTexto(l).replace(/^[-–•*·\s]+/,'').trim())
    .filter(Boolean).map(l => ({id:uid(), txt:l, hecho:false}));
  n.titulo = document.getElementById('edTit').value.trim();
  n.contenido = ''; n.tipo = 'lista';
  await persistirN(); abrirEditor(n.id);
}

async function convertirATexto(){
  const n = notas.find(x => x.id === notaAbierta); if(!n) return;
  n.contenido = (n.items||[]).map(i => esc(soloTexto(i.txt))).join('<br>');
  n.titulo = document.getElementById('edTit').value.trim();
  n.items = []; n.tipo = 'texto';
  await persistirN(); abrirEditor(n.id);
}

async function cerrarEditor(){
  const n = notas.find(x => x.id === notaAbierta);
  if(n){
    n.titulo = document.getElementById('edTit').value.trim();
    const b = document.getElementById('edBody');
    if(b){
      let h = limpiar(b.innerHTML);
      // Arrastres de versiones anteriores: &amp;amp;nbsp; y compañía
      while(/&amp;(amp|nbsp|lt|gt|quot|#39);/i.test(h)) h = h.replace(/&amp;(amp|nbsp|lt|gt|quot|#39);/gi, '&$1;');
      n.contenido = h;
    }
    if(n.tipo === 'lista'){
      document.querySelectorAll('#edItems [data-txt]').forEach(i => {
        const it = n.items.find(x => x.id === i.dataset.txt); if(it) it.txt = i.value;
      });
      n.items = n.items.filter(i => i.txt.trim());
    }
    n.categoria = leerCategoria('edEti');
    n.proyecto = leerProyecto();
    n.privado = leerPrivado();
    n.enInicio = leerInicio();
    const c = document.querySelector('#edCol button[aria-pressed="true"]');
    n.color = c ? c.dataset.c : 'bone';
    n.fija = document.querySelector('[data-pin2]').getAttribute('aria-pressed') === 'true';
    const vacia = !n.titulo && !soloTexto(n.contenido) && !(n.items||[]).length;
    if(vacia) notas = notas.filter(x => x.id !== n.id);
    await persistirN();
  }
  document.getElementById('editor').classList.remove('on');
  notaAbierta = null; render();
}

async function borrarDesdeEditor(){
  const n = notas.find(x => x.id === notaAbierta); if(!n) return;
  if(!confirm(`¿Borrar "${n.titulo || 'esta nota'}"?`)) return;
  await aPapelera('nota', n);
  const copia = {...n};
  notas = notas.filter(x => x.id !== n.id);
  document.getElementById('editor').classList.remove('on');
  notaAbierta = null; render(); await persistirN();
  aviso('Nota borrada', async () => { notas.push(copia); render(); await persistirN(); });
}

/* ---------- Reordenar arrastrando por el asa ---------- */
let llevando = null, destino = null;
let recien = null, recienTimer = null, verTodoAhora = false;

function destacar(id){
  recien = id;
  clearTimeout(recienTimer);
  recienTimer = setTimeout(() => { recien = null; render(); }, 2600);
  setTimeout(() => {
    const el = document.querySelector('.recien');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 60);
}

function enlazarN(){
  const el = document.getElementById('view-notas');
  el.querySelectorAll('[data-editn]').forEach(b => b.onclick = () => abrirEditor(b.dataset.editn));
  el.querySelectorAll('[data-item]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const [nid, iid] = b.dataset.item.split('|');
    const n = notas.find(x => x.id === nid);
    const it = n.items.find(x => x.id === iid);
    it.hecho = !it.hecho; render(); await persistirN();
  });
  el.querySelectorAll('[data-pin]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const n = notas.find(x => x.id === b.dataset.pin);
    n.fija = !n.fija; render(); await persistirN();
  });
  el.querySelectorAll('[data-asa]').forEach(a => a.addEventListener('pointerdown', iniciarArrastre));
  el.querySelectorAll('[data-verproy]').forEach(b => b.onclick = e => { e.stopPropagation(); verProyecto(b.dataset.verproy); });
}

function iniciarArrastre(e){
  e.preventDefault();
  const tarjeta = e.target.closest('.nota'); if(!tarjeta) return;
  llevando = tarjeta.dataset.nota;
  tarjeta.classList.add('llevando');
  e.target.setPointerCapture(e.pointerId);
  e.target.addEventListener('pointermove', moverArrastre);
  e.target.addEventListener('pointerup', soltarArrastre, {once:true});
  e.target.addEventListener('pointercancel', soltarArrastre, {once:true});
}

function moverArrastre(e){
  if(!llevando) return;
  document.querySelectorAll('.nota.destino').forEach(x => x.classList.remove('destino'));
  const bajo = document.elementFromPoint(e.clientX, e.clientY);
  const t = bajo && bajo.closest('.nota');
  destino = (t && t.dataset.nota !== llevando) ? t.dataset.nota : null;
  if(destino) t.classList.add('destino');
}

async function soltarArrastre(e){
  e.target.removeEventListener('pointermove', moverArrastre);
  document.querySelectorAll('.nota.llevando,.nota.destino')
    .forEach(x => x.classList.remove('llevando','destino'));
  if(llevando && destino && llevando !== destino){
    const lista = notasOrdenadas();
    const desde = lista.findIndex(n => n.id === llevando);
    const hasta = lista.findIndex(n => n.id === destino);
    const [movida] = lista.splice(desde, 1);
    lista.splice(hasta, 0, movida);
    lista.forEach((n, i) => { const real = notas.find(x => x.id === n.id); real.orden = i; });
    render(); await persistirN();
  }
  llevando = null; destino = null;
}

// A pantalla completa el panel tapa el fondo, así que la salida es la tecla atrás:
// al abrir metemos una entrada en el historial y al cerrar la sacamos.
let sheetEnHistorial = false;
function abrirSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheet').scrollTop = 0;
  const g = document.querySelector('#sheet .grip');
  if(g){ g.style.cursor = 'pointer'; g.onclick = cerrarSheet; }
  if(!sheetEnHistorial){ history.pushState({sheet:true}, ''); sheetEnHistorial = true; }
}
function cerrarSheet(){
  const habia = sheetEnHistorial;
  sheetEnHistorial = false;
  ocultarSheet();
  if(habia) history.back();
}
function ocultarSheet(){
  // Lo creado desde la barra solo cuenta si le das a Guardar
  if(editando){
    const t = tareas.find(x => x.id === editando), e = eventos.find(x => x.id === editando);
    if(t && t.borrador) tareas = tareas.filter(x => x.id !== editando);
    if(e && e.borrador) eventos = eventos.filter(x => x.id !== editando);
    if((t && t.borrador) || (e && e.borrador)) setTimeout(render, 0);
  }
  editando = null; editTipo = null;
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
window.addEventListener('popstate', () => {
  if(sheetEnHistorial){ sheetEnHistorial = false; ocultarSheet(); }
});
function segClick(id){
  const s = document.getElementById(id); if(!s) return;
  s.querySelectorAll('button').forEach(b => b.onclick = () => {
    s.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
  });
}
function checkClick(id){
  const c = document.getElementById(id); if(!c) return;
  c.onclick = () => c.setAttribute('aria-pressed', c.getAttribute('aria-pressed')==='true' ? 'false' : 'true');
}

async function guardarTarea(){
  const t = tareas.find(x => x.id === editando); if(!t) return cerrarSheet();
  const tit = document.getElementById('f-tit').value.trim();
  if(!tit) return aviso('El título no puede quedar vacío');
  t.titulo = tit;
  t.fechaLimite = document.getElementById('f-fec').value || null;
  t.categoria = leerCategoria('f-cat');
  t.notas = document.getElementById('f-not').value.trim();
  t.proyecto = leerProyecto();
  t.privado = leerPrivado();
  t.enInicio = leerInicio();
  const p = document.getElementById('f-pri');
  t.prioridad = p ? p.value : 'Media';
  const nuevo = t.borrador; delete t.borrador;
  const id = t.id; editando = null;
  cerrarSheet();
  if(nuevo) destacar(id);
  render(); await persistirT();
  if(nuevo) aviso(`Añadida · ${t.titulo}`);
}
async function borrarTarea(){
  const t = tareas.find(x => x.id === editando); if(!t) return;
  const n = hijas(t.id).length;
  if(!confirm(n ? `¿Borrar "${t.titulo}" y sus ${n} subtareas?` : `¿Borrar "${t.titulo}"?`)) return;
  await aPapelera('tarea', t);
  for(const h of hijas(t.id)) await aPapelera('tarea', h);
  tareas = tareas.filter(x => x.id !== t.id && x.parentId !== t.id);
  cerrarSheet(); render(); await persistirT(); aviso('Tarea borrada');
}

/* ============================================================
   LEER TEXTO PEGADO — sin IA, con reglas
   ============================================================ */
const MESES_TXT = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,
  agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};

function dosDig(n){ return String(n).padStart(2,'0'); }

// Busca fechas en cualquiera de los formatos que aparecen en mensajes reales
function sacarFechas(txt){
  const hoy = new Date(), out = [];
  let m;

  // 20/08/2026 · 18-08-2026 · 4.8.26
  const re1 = /\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/g;
  while((m = re1.exec(txt))){
    let [_, d, mes, a] = m;
    a = Number(a); if(a < 100) a += 2000;
    if(Number(mes) >= 1 && Number(mes) <= 12 && Number(d) >= 1 && Number(d) <= 31)
      out.push({iso:`${a}-${dosDig(mes)}-${dosDig(d)}`, pos:m.index, txt:m[0]});
  }

  // 2026-08-18
  const re2 = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  while((m = re2.exec(txt))) out.push({iso:`${m[1]}-${m[2]}-${m[3]}`, pos:m.index, txt:m[0]});

  // 14 de agosto (de 2026)
  const re3 = /\b(\d{1,2})\s+de\s+([a-záéíóú]+)(?:\s+de\s+(\d{4}))?/gi;
  while((m = re3.exec(txt))){
    const mes = MESES_TXT[m[2].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')];
    if(!mes) continue;
    let a = m[3] ? Number(m[3]) : hoy.getFullYear();
    if(!m[3]){
      const cand = new Date(a, mes-1, Number(m[1]));
      if((hoy - cand) / 864e5 > 180) a++;
    }
    out.push({iso:`${a}-${dosDig(mes)}-${dosDig(m[1])}`, pos:m.index, txt:m[0]});
  }
  return out.sort((a,b) => a.pos - b.pos);
}

// Frases que delatan una fecha límite en vez de una cita
const RE_LIMITE = /\b(antes del|hasta el|hasta:|v[áa]lido hasta|caduca|vence|l[íi]mite|plazo|recoge antes)\b/i;

// Pistas de que una fecha es LA fecha, y no adorno de la pantalla
const PISTAS_FECHA = /(entre|desde|hasta|antes del|el d[íi]a|fecha|hora|cita|v[áa]lido|caduca|vence|recoge|reserva|plazo|l[íi]mite|a partir)/i;

// Las separaciones de fecha del chat van solas en su línea: "12 de agosto de 2026"
function lineaDe(txt, pos){
  const ini = txt.lastIndexOf('\n', pos) + 1;
  let fin = txt.indexOf('\n', pos);
  if(fin < 0) fin = txt.length;
  return txt.slice(ini, fin).trim();
}

// En vez de quedarnos con la primera, puntuamos cuál es la buena
function elegirFechas(txt){
  const brutas = sacarFechas(txt);
  if(!brutas.length) return [];
  const cuenta = {};
  brutas.forEach(f => { cuenta[f.iso] = (cuenta[f.iso] || 0) + 1; });

  const punt = brutas.map(f => {
    let p = 0;
    const linea = lineaDe(txt, f.pos);
    const antes = txt.slice(Math.max(0, f.pos - 60), f.pos);
    const despues = txt.slice(f.pos + f.txt.length, f.pos + f.txt.length + 30);

    // Lleva una hora pegada: casi seguro es la fecha del asunto
    if(/^[\s,]*([01]?\d|2[0-3])[:.][0-5]\d/.test(despues)) p += 4;
    // La acompaña una palabra que anuncia fecha
    if(PISTAS_FECHA.test(antes)) p += 3;
    // Aparece repetida (18-08-2026 sale dos veces en el SMS)
    if(cuenta[f.iso] > 1) p += 2;
    // Va sola en su línea: es una separación de chat
    if(linea === f.txt) p -= 5;
    // Línea muy corta y sin más contexto: sospechosa
    if(linea.length < f.txt.length + 6) p -= 2;
    // Muy al principio del texto, donde va la cabecera del chat
    if(f.pos < txt.length * 0.12) p -= 1;
    return {...f, p};
  });

  // Nos quedamos con una por fecha, la mejor puntuada
  const mejor = {};
  punt.forEach(f => { if(!mejor[f.iso] || f.p > mejor[f.iso].p) mejor[f.iso] = f; });
  return Object.values(mejor).sort((a,b) => b.p - a.p || a.pos - b.pos);
}

function sacarHoras(txt){
  const out = [];
  const re = /\b([01]?\d|2[0-3])[:.,]([0-5]\d)\b(?!\s*[€$])/g;
  let m;
  while((m = re.exec(txt))){
    const cola = txt.slice(m.index + m[0].length, m.index + m[0].length + 4);
    if(/^\s*(€|eur)/i.test(cola)) continue;
    out.push({hora:`${dosDig(m[1])}:${m[2]}`, pos:m.index});
  }
  return out;
}

function sacarImporte(txt){
  let m = /(\d{1,3}(?:[.\s]\d{3})*(?:,\d{2})?|\d+(?:[.,]\d{1,2})?)\s*(?:€|eur\b|euros\b)/i.exec(txt);
  if(!m) m = /(?:€|eur\s?)\s*(\d{1,3}(?:[.\s]\d{3})*(?:,\d{2})?|\d+(?:[.,]\d{1,2})?)/i.exec(txt);
  if(!m) return null;
  let n = m[1].replace(/[.\s]/g,'').replace(',','.');
  const v = Number(n);
  return isNaN(v) ? null : v;
}

const RE_MATRICULA = /\b(\d{4})\s?([BCDFGHJKLMNPRSTVWXYZ]{3})\b/;

function sacarCodigos(txt){
  const c = [];
  let m;
  if((m = /c[óo]digo\s+(?:de\s+)?(?:recogida|acceso|reserva)?\s*(?:es\s*)?[:\s]\s*([A-Z0-9]{4,20})/i.exec(txt)))
    c.push({k:'Código de recogida', v:m[1]});
  if((m = /localizador\s*[:\s]\s*([A-Za-z0-9]{5,20})/i.exec(txt)))
    c.push({k:'Localizador', v:m[1]});
  if((m = /n[ºo°]?\s*cheque\s*[:\s]\s*(\d{8,25})/i.exec(txt)))
    c.push({k:'Nº cheque', v:m[1]});
  if((m = /n[ºo°]?\s*socio\s*[:\s]\s*(\d{8,25})/i.exec(txt)))
    c.push({k:'Nº socio', v:m[1]});
  if((m = RE_MATRICULA.exec(txt)))
    c.push({k:'Matrícula', v:m[1] + ' ' + m[2]});
  if((m = /\bref(?:erencia)?\.?\s*[:\s]\s*([A-Z0-9\-]{4,20})/i.exec(txt)))
    c.push({k:'Referencia', v:m[1]});
  return c;
}


const RE_ITV = /\bitv\b/i;

// Asuntos que reconocemos y merecen un nombre claro
const ASUNTOS = [
  [/\bitv\b/i,                                    'ITV'],
  [/corte de (suministro|agua|luz)/i,              'Corte de suministro'],
  [/\blisto para su recogida\b|\brecogida\b/i,     'Recoger pedido'],
  [/\bcheque\b/i,                                 'Cheque'],
  [/\bcita (confirmada|previa)\b/i,               'Cita'],
  [/\bfactura\b/i,                                'Factura'],
  [/\bpedido\b/i,                                 'Pedido'],
  [/\brevisi[óo]n\b/i,                             'Revisión'],
  [/\bmantenimiento\b/i,                          'Mantenimiento'],
];

// Una línea que es casi toda cifras no sirve como título
function esRelleno(l){
  const letras = (l.match(/[a-záéíóúñ]/gi) || []).length;
  const cifras = (l.match(/\d/g) || []).length;
  if(letras < 5) return true;
  if(cifras > letras) return true;
  if(/^(fecha|hora|centro|lugar|matr[íi]cula|localizador|m[óo]vil|n[ºo°]|tel[ée]fono|v[áa]lido|veh[íi]culo)\b/i.test(l)) return true;
  if(/^(pol\.?\s*ind|calle|c\/|avda|avenida|plaza|ctra|carretera|c[óo]digo postal)\b/i.test(l)) return true;
  return false;
}

function titularDe(txt){
  // 1) ¿Reconocemos el asunto? Entonces damos un nombre limpio
  for(const [re, nom] of ASUNTOS){
    if(re.test(txt)){
      const marca = /\b(Amazon|Leroy Merlin|Decathlon|Norauto|Obramart|Aqualia|Iberdrola|Endesa|Movistar|Mercadona|Correos|SEUR|MRW)\b/i.exec(txt);
      return marca ? `${nom} · ${marca[1]}` : nom;
    }
  }
  // 2) Si no, la primera línea que aporte algo
  const l = txt.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const buena = l.find(x => x.length > 8 && x.length < 90 && !esRelleno(x));
  if(buena) return buena.replace(/^[-–•*]\s?/, '').slice(0, 70);
  // 3) Ni eso: al menos di de qué va por las pistas que haya
  if(/matr[íi]cula/i.test(txt) && /veh[íi]culo|di[ée]sel|gasolina/i.test(txt)) return 'Cita del coche';
  if(/localizador|reserva/i.test(txt)) return 'Reserva';
  return (l[0] || 'Sin título').replace(/^[-–•*]\s?/, '').slice(0, 70);
}

function detectarLugar(txt){
  const l = txt.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  // "Centro" o "Dirección" en una línea y el valor en la siguiente
  for(let i = 0; i < l.length - 1; i++){
    if(/^(centro|lugar|direcci[óo]n|tienda|sede)\b:?$/i.test(l[i])){
      const sig = [l[i+1], l[i+2]].filter(x => x && !esRelleno(x) || (x && /^[A-ZÁÉÍÓÚ]/.test(x)));
      if(sig.length) return sig.slice(0,2).join(', ').slice(0,70);
    }
  }
  let m = /\b(?:en|centro|lugar|direcci[óo]n|tienda)\s*[:\s]\s*([A-ZÁÉÍÓÚ][^\n,.;]{3,50})/.exec(txt);
  if(m) return m[1].trim();
  m = /\b(Amazon Locker[^\n]{0,45}|Leroy Merlin|Decathlon|Norauto|Obramart|Mercadona|Carrefour|Ikea)\b/i.exec(txt);
  if(m) return m[1].trim();
  m = /\b(?:CT\/|calle|c\/|avda|avenida|plaza|pol\.?\s*ind)[^\n.]{4,50}/i.exec(txt);
  if(!m) return '';
  // Cortar antes de que empiece la fecha o el resto de la frase
  return m[0].split(/\s+(?:entre|desde|el d[íi]a|\d{1,2}[\/\-.]\d)/i)[0].trim().slice(0,60);
}

// Une todo y propone qué guardar
function interpretarPegado(txt){
  const fechas = elegirFechas(txt);
  const todasHoras = sacarHoras(txt);
  // Una hora solo cuenta si va pegada a la fecha o la anuncia la palabra "hora"
  const etiquetada = h => /(hora|a las|desde las|hasta las|entre las)\s*[:\s]?$/i
    .test(txt.slice(Math.max(0, h.pos - 14), h.pos));
  let horas;
  if(fechas.length && fechas[0].p > 0){
    const ini = fechas[0].pos;
    horas = todasHoras.filter(h => (h.pos >= ini && h.pos < ini + 50) || etiquetada(h));
  } else {
    // Sin una fecha fiable, solo aceptamos las que van anunciadas
    horas = todasHoras.filter(etiquetada);
    if(!horas.length && todasHoras.length === 1) horas = todasHoras;
  }
  horas = horas.sort((a,b) => a.pos - b.pos);
  // Un plazo ("antes del 14 de agosto") no lleva hora: solo vale la que va pegada
  if(fechas.length){
    const ctx = txt.slice(Math.max(0, fechas[0].pos - 45), fechas[0].pos);
    if(RE_LIMITE.test(ctx)){
      const fin = fechas[0].pos + fechas[0].txt.length;
      horas = horas.filter(h => h.pos >= fechas[0].pos && h.pos < fin + 22);
    }
  }
  const importe = sacarImporte(txt);
  const codigos = sacarCodigos(txt);
  const lugar = detectarLugar(txt);
  const limite = RE_LIMITE.test(txt);
  const lineas = txt.split(/\r?\n/).map(x => x.trim()).filter(Boolean);

  // ¿Parece una lista? Muchas líneas cortas, a menudo con guion
  const cortas = lineas.filter(l => l.length <= 40);
  const conGuion = lineas.filter(l => /^[-–•*]\s?/.test(l));
  const esLista = lineas.length >= 4 && cortas.length >= lineas.length * 0.8 &&
    !fechas.length && (conGuion.length >= 2 || lineas.length >= 5);

  let tipo, motivo;
  if(esLista){ tipo = 'lista'; motivo = 'varias líneas cortas, sin fechas'; }
  else if(fechas.length && !limite){ tipo = 'evento'; motivo = horas.length ? 'tiene fecha y hora' : 'tiene fecha'; }
  else if(fechas.length && limite){ tipo = 'tarea'; motivo = 'habla de un plazo o vencimiento'; }
  else if(codigos.length && !fechas.length){ tipo = 'ficha'; motivo = 'son datos de referencia'; }
  else { tipo = 'nota'; motivo = 'no encuentro fecha ni estructura'; }

  return {
    tipo, motivo,
    titulo: esLista ? 'Lista de la compra' : titularDe(txt),
    fecha: fechas[0] ? fechas[0].iso : '',
    fecha2: fechas[1] ? fechas[1].iso : '',
    hora: horas[0] ? horas[0].hora : '',
    horaFin: horas[1] ? horas[1].hora : '',
    importe, lugar, codigos,
    items: esLista ? lineas.map(l => l.replace(/^[-–•*]\s?/, '')).filter(Boolean) : [],
    crudo: txt.trim()
  };
}


/* ---------- Leer texto de una imagen (Tesseract, en el propio móvil) ---------- */
let motorOCR = null, imagenPegada = null, textoImagen = '';

function cargarTesseract(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((ok, mal) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js';
    sc.onload = ok;
    sc.onerror = () => mal(new Error('sin conexión'));
    document.head.appendChild(sc);
  });
}

// Reducir y realzar contraste: mejora bastante el resultado y acelera
function prepararImagen(file, maxLado = 1600){
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => {
      let {width:w, height:h} = img;
      const e = Math.min(1, maxLado / Math.max(w, h));
      w = Math.round(w*e); h = Math.round(h*e);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0, w, h);
      const d = x.getImageData(0, 0, w, h), p = d.data;
      for(let i = 0; i < p.length; i += 4){
        const g = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
        const v = Math.max(0, Math.min(255, (g - 128) * 1.35 + 128));
        p[i] = p[i+1] = p[i+2] = v;
      }
      x.putImageData(d, 0, 0);
      c.toBlob(b => ok({blob:b, url:c.toDataURL('image/jpeg', 0.72)}), 'image/jpeg', 0.82);
    };
    img.onerror = mal;
    img.src = URL.createObjectURL(file);
  });
}

async function leerImagen(file){
  const zona = document.getElementById('pgProgreso');
  const pinta = (txt, pct) => { if(zona) zona.innerHTML =
    `<div class="pg-progreso"><div class="txt">${txt}</div>
     <div class="barra"><i style="width:${pct}%"></i></div></div>`; };

  try{
    pinta('Preparando la imagen…', 8);
    const prep = await prepararImagen(file);
    imagenPegada = prep.url;
    pintarPrevia();

    pinta('Cargando el lector (solo la primera vez)…', 18);
    await cargarTesseract();

    pinta('Leyendo el texto…', 30);
    const res = await window.Tesseract.recognize(prep.blob, 'spa', {
      logger: m => {
        if(m.status === 'recognizing text') pinta('Leyendo el texto…', 30 + Math.round(m.progress*65));
      }
    });
    const texto = (res.data.text || '').replace(/\n{3,}/g, '\n\n').trim();
    if(zona) zona.innerHTML = '';

    if(!texto || texto.length < 6){
      aviso('No he sacado texto legible');
      return;
    }
    textoImagen = texto;              // se guarda oculto para que Buscar lo encuentre
    const campo = document.getElementById('pgTexto');
    campo.value = campo.value.trim() ? campo.value.trim() + '\n' + texto : texto;
    leerPegado();
    const conf = Math.round(res.data.confidence || 0);
    aviso(conf && conf < 70 ? `Leído con dudas (${conf}%) — revísalo` : 'Texto leído');
  }catch(err){
    if(zona) zona.innerHTML = '';
    aviso(String(err.message).includes('conexión')
      ? 'El lector necesita internet la primera vez'
      : 'No he podido leer la imagen');
  }
}

function pintarPrevia(){
  const z = document.getElementById('pgPrevia'); if(!z) return;
  z.innerHTML = imagenPegada ? `<div class="pg-previa">
      <img src="${imagenPegada}" alt="">
      <button class="pg-quitar" id="pgQuitar" aria-label="Quitar imagen">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg></button>
    </div>` : '';
  const q = document.getElementById('pgQuitar');
  if(q) q.onclick = () => { imagenPegada = null; pintarPrevia(); };
}

function elegirImagen(camara){
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  if(camara) i.capture = 'environment';
  i.onchange = () => { if(i.files[0]) leerImagen(i.files[0]); };
  i.click();
}

async function pegarDelPortapapeles(){
  try{
    const items = await navigator.clipboard.read();
    for(const it of items){
      const tipoImg = it.types.find(t => t.startsWith('image/'));
      if(tipoImg){ leerImagen(await it.getType(tipoImg)); return; }
    }
    const t = await navigator.clipboard.readText();
    if(t){ const c = document.getElementById('pgTexto'); c.value = t; leerPegado(); return; }
    aviso('El portapapeles está vacío');
  }catch(e){
    try{
      const t = await navigator.clipboard.readText();
      if(t){ const c = document.getElementById('pgTexto'); c.value = t; leerPegado(); return; }
    }catch(_){}
    aviso('Pega a mano en el cuadro');
  }
}

      proyecto:'', creado:new Date().toISOString()});
    filtroN = 'todas';
    await persistirN(); irA('notas');
  }
  else {
    notas.push({id:nuevoId, titulo:r.titulo, contenido:esc(r.crudo).replace(/\n/g,'<br>'),
      tipo:'texto', items:[], categoria:'Sin categoría', color:'bone', fija:false,

      proyecto:'', creado:new Date().toISOString()});

  // Los códigos, a su ficha

  pegado = null;

/* ============================================================
   PROYECTOS — una lente sobre lo que ya existe
   ============================================================ */
// No son un módulo aparte: es un campo que comparten los cuatro tipos
function proyectos(){
  const n = new Set();
  [...tareas, ...eventos, ...notas, ...fichas].forEach(x => { if(x.proyecto) n.add(x.proyecto); });
  return [...n].sort((a,b) => a.localeCompare(b));
}

function resumenProyecto(nom){
  // Una subtarea cuenta para el proyecto de su padre, aunque no lo lleve escrito
  const deProyecto = t => t.proyecto === nom ||
    (t.parentId && (tareas.find(x => x.id === t.parentId)||{}).proyecto === nom);
  const ta = tareas.filter(deProyecto);
  const ev = eventos.filter(e => e.proyecto === nom);
  const no = notas.filter(n => n.proyecto === nom);
  const fi = fichas.filter(f => f.proyecto === nom);
  const hechas = ta.filter(t => t.estado === 'hecha').length;
  const gasto = ev.reduce((s,e) => s + (Number(e.coste)||0), 0);
  const material = no.filter(n => n.tipo === 'lista')
    .flatMap(n => (n.items||[]).filter(i => !i.hecho).map(i => i.txt));
  const prox = ev.filter(e => dias(fechaEfectiva(e)) >= 0)
    .sort((a,b) => fechaEfectiva(a).localeCompare(fechaEfectiva(b)))[0];
  return {nom, ta, ev, no, fi, hechas, gasto, material, prox,
    pct: ta.length ? Math.round(hechas/ta.length*100) : 0,
    activo: ta.some(t => t.estado !== 'hecha') || material.length > 0};
}

/* ============================================================
   BUSCAR — sobre todos los módulos, sin conexión
   ============================================================ */
let consulta = '';

// "Llíria" y "lliria" deben ser lo mismo
const norm = t => String(t||'').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9áéíóúñ\s€.,:/-]/gi,' ');

// Distancia de edición corta: tolera "cerbo" → "cerco"
function parecido(a, b){
  if(Math.abs(a.length - b.length) > 2) return false;
  const m = a.length, n = b.length;
  let fila = Array.from({length:n+1}, (_,i) => i);
  for(let i=1;i<=m;i++){
    let ant = fila[0]; fila[0] = i;
    for(let j=1;j<=n;j++){
      const tmp = fila[j];
      fila[j] = Math.min(fila[j]+1, fila[j-1]+1, ant + (a[i-1]===b[j-1] ? 0 : 1));
      ant = tmp;
    }
  }
  return fila[n] <= (Math.min(m,n) >= 6 ? 2 : 1);
}

// ¿El texto contiene la palabra, aunque esté mal escrita?
function encaja(texto, palabra){
  const t = norm(texto);
  if(t.includes(palabra)) return true;

  // ¿Alguna palabra del grupo de sinónimos aparece en el texto?
  const grupo = grupoDe(palabra);
  if(grupo && grupo.some(g => g !== palabra && t.includes(g))) return true;

  if(palabra.length < 4) return false;
  return t.split(/\s+/).some(p => {
    if(parecido(p, palabra)) return true;
    // Y con tolerancia a erratas dentro del propio sinónimo
    return grupo ? grupo.some(g => g !== palabra && g.length >= 4 && parecido(p, g)) : false;
  });
}

// Palabras que significan lo mismo aunque tú y yo las escribamos distinto
const SINONIMOS = [
  ['rueda','ruedas','neumatico','neumaticos','llanta','llantas'],
  ['coche','carro','auto','vehiculo'],
  ['itv','inspeccion tecnica'],
  ['casa','vivienda','hogar','domicilio'],
  ['medico','doctor','consulta'],
  ['cumple','cumpleanos','cumpleaño'],
  ['compra','compras','super','supermercado','mercado'],
  ['factura','recibo','ticket'],
  ['revision','chequeo','mantenimiento'],
  ['seguro','poliza'],
  ['cita','visita'],
];
const grupoDe = w => SINONIMOS.find(g => g.includes(w));

const MESES_BUSCA = {enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,
  agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};

// Saca de la consulta lo que no son palabras: meses, años, atajos
function interpretar(q){
  const p = norm(q).split(/\s+/).filter(Boolean);
  const f = {palabras:[], mes:null, anio:null, atajo:null};
  p.forEach(x => {
    if(MESES_BUSCA[x] !== undefined){ f.mes = MESES_BUSCA[x]; return; }
    if(/^(19|20)\d{2}$/.test(x)){ f.anio = Number(x); return; }
    if(['garantia','garantias'].includes(x)){ f.atajo = 'garantia'; return; }
    if(['atrasado','atrasadas','atrasados','vencido','vencidas'].includes(x)){ f.atajo = 'atrasado'; return; }
    if(['gasto','gastos','coste','costes','euros','€','dinero','ticket','tickets'].includes(x)){ f.atajo = 'gasto'; return; }
    if(['hoy'].includes(x)){ f.atajo = 'hoy'; return; }
    if(['pendiente','pendientes'].includes(x)){ f.atajo = 'pendiente'; return; }
    f.palabras.push(x);
  });
  return f;
}

function enFecha(fecha, f){
  if(!fecha) return f.mes === null && f.anio === null;
  const d = new Date(fecha+'T00:00:00');
  if(f.mes !== null && d.getMonth() !== f.mes) return false;
  if(f.anio !== null && d.getFullYear() !== f.anio) return false;
  return true;
}

function buscar(q, flojo){
  const f = interpretar(q);
  const hayFiltro = f.mes !== null || f.anio !== null || f.atajo;
  if(!f.palabras.length && !hayFiltro) return null;
  const cala = campos => {
    const texto = campos.filter(Boolean).join(' · ');
    return flojo ? f.palabras.some(p => encaja(texto, p))
                 : f.palabras.every(p => encaja(texto, p));
  };

  const res = {eventos:[], tareas:[], notas:[], fichas:[]};

  eventos.forEach(e => {
    const fe = fechaEfectiva(e);
    if(!enFecha(fe, f)) return;
    if(f.atajo === 'garantia' && !(e.garantia && dias(e.garantia) >= 0)) return;
    if(f.atajo === 'gasto' && !(e.coste || e.coste === 0)) return;
    if(f.atajo === 'hoy' && fe !== hoyISO()) return;
    if(f.atajo === 'atrasado' || f.atajo === 'pendiente') return;
    if(cala([e.titulo, e.lugar, e.categoria, e.ticket, e.notas, e.proyecto, e.textoFoto])) res.eventos.push(e);
  });

  tareas.forEach(t => {
    if(!enFecha(t.fechaLimite, f)) return;
    if(f.atajo === 'atrasado' && !(t.estado !== 'hecha' && dias(t.fechaLimite) !== null && dias(t.fechaLimite) < 0)) return;
    if(f.atajo === 'pendiente' && t.estado === 'hecha') return;
    if(f.atajo === 'hoy' && dias(t.fechaLimite) !== 0) return;
    if(f.atajo === 'garantia' || f.atajo === 'gasto') return;
    if(cala([t.titulo, t.categoria, t.notas, t.proyecto, t.textoFoto])) res.tareas.push(t);
  });

  if(!['garantia','gasto','atrasado','pendiente'].includes(f.atajo)){
    notas.forEach(n => {
      if(f.mes !== null || f.anio !== null){
        if(!enFecha((n.creado||'').slice(0,10), f)) return;
      }
      const items = (n.items||[]).map(i => i.txt).join(' · ');
      if(cala([n.titulo, soloTexto(n.contenido||''), n.categoria, items])) res.notas.push(n);
    });
    fichas.forEach(x => {
      if(f.mes !== null || f.anio !== null) return;
      const campos = (x.campos||[]).map(c => `${c.k} ${c.v}`).join(' · ');
      if(cala([x.titulo, x.categoria, campos, x.notas])) res.fichas.push(x);
    });
  }
  const total = res.eventos.length + res.tareas.length + res.notas.length + res.fichas.length;
  // Si pidiendo todas las palabras no sale nada, aflojamos y buscamos las que encajen
  if(!total && !flojo && f.palabras.length > 1) return buscar(q, true);
  return {f, res, flojo:!!flojo};
}

function resaltar(texto, palabras){
  let h = esc(texto);
  palabras.forEach(p => {
    if(p.length < 2) return;
    const re = new RegExp('(' + p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    h = h.replace(re, '<mark>$1</mark>');
  });
  return h;
}
